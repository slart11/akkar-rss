<!DOCTYPE html>
<html lang="no" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Akkar</title>

    <meta name="theme-color" content="#060d20">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Akkar">

    <link rel="preload" as="image" href="./icon-512.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f9edf1',
                            100: '#f2d4df',
                            200: '#e7aec2',
                            300: '#db7fa0',
                            400: '#ca4f7c',
                            500: '#b40f49',
                            600: '#980d3e',
                            700: '#7c0b33',
                            800: '#5f0928',
                            900: '#43061c',
                        },
                        accent: {
                            100: '#faefc9',
                            300: '#f0cf74',
                            500: '#ddb445',
                            600: '#c99626',
                            700: '#9b751a'
                        },
                        darkbg: '#060d20',
                        darkcard: '#0b1633',
                        darksidebar: '#09132b',
                        darkborder: '#1c2d54'
                    }
                }
            }
        }
    </script>

    <!-- React 18 & ReactDOM & Babel -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.28.4/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.559.0/dist/umd/lucide.min.js"></script>

    <!-- Robust drag-and-drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

    <!-- Font Family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            background: linear-gradient(180deg, #fcf5f7 0%, #f7eaef 100%);
        }
        html.dark body {
            background:
                radial-gradient(circle at top, rgba(180, 15, 73, 0.22), transparent 34%),
                linear-gradient(180deg, #081229 0%, #060d20 100%);
        }
        *::selection {
            background: rgba(180, 15, 73, 0.28);
            color: inherit;
        }

        /* Diskret mørkere mouseover på alle knapper.
           Bare mus/peker får hover-effekten, så mobiltrykk ikke blir hengende. */
        @media (hover: hover) and (pointer: fine) {
            button:not(:disabled):hover {
                filter: brightness(0.90) !important;
            }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(180, 15, 73, 0.35);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(180, 15, 73, 0.58);
        }
        @keyframes akkar-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .akkar-spin {
            animation: akkar-spin 0.8s linear infinite;
            transform-origin: center;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    
        .akkar-feed-row {
            cursor: grab;
        }
        .akkar-feed-row:active {
            cursor: grabbing;
        }
        body.akkar-sortable-dragging,
        body.akkar-sortable-dragging *,
        .akkar-sortable-chosen,
        .akkar-sortable-chosen * {
            cursor: grabbing !important;
            cursor: -webkit-grabbing !important;
        }
        .akkar-sortable-ghost {
            opacity: 0.18 !important;
        }
        .akkar-sortable-chosen {
            opacity: 0.35 !important;
        }
        .akkar-sortable-fallback {
            opacity: 1 !important;
            background: #ffffff !important;
            border: 1px solid #db7fa0 !important;
            border-radius: 8px !important;
            box-shadow: 0 14px 32px rgba(0,0,0,.28) !important;
            transform: scale(1.015);
            z-index: 9999 !important;
        }
        html.dark .akkar-sortable-fallback {
            background: #10214d !important;
            border-color: #7e1335 !important;
        }
        .akkar-feed-list {
            min-height: 10px;
        }

        .akkar-between-folders-zone {
            position: relative;
            min-height: 0;
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            overflow: visible;
        }

        /* Slippfeltet tegnes som et overlay og tar derfor ingen plass i layouten.
           Mapper og strømmer står helt stille når dragging starter. */
        body.akkar-sortable-dragging .akkar-between-folders-zone::after {
            content: "";
            position: absolute;
            left: 4px;
            right: 4px;
            top: -4px;
            bottom: -4px;
            border-radius: 7px;
            background: rgba(221, 180, 69, .16);
            border: 2px dashed rgba(221, 180, 69, .74);
            box-sizing: border-box;
            pointer-events: none;
            z-index: 12;
            transition:
                background .12s ease,
                border-color .12s ease,
                box-shadow .12s ease;
        }

        body.akkar-sortable-dragging .akkar-between-folders-zone.akkar-ungrouped-drop-active::after {
            background: rgba(221, 180, 69, .34);
            border-color: #f0cf74;
            box-shadow:
                0 0 0 2px rgba(221, 180, 69, .14),
                0 0 14px rgba(221, 180, 69, .28);
        }

        body.akkar-sortable-dragging .akkar-folder-drop-visual {
            background: #08132f;
            border-radius: 10px;
            box-shadow: inset 0 0 0 1px rgba(35, 57, 105, .72);
        }

        html:not(.dark) body.akkar-sortable-dragging .akkar-folder-drop-visual {
            background: #c8d6ea;
            box-shadow: inset 0 0 0 1px rgba(35, 57, 105, .18);
        }

        /* Når en mappe flyttes, lukkes alle mapper visuelt midlertidig.
           Tilstanden endres ikke, så de åpnes igjen akkurat som før når drag slutter. */
        body.akkar-folder-sort-dragging .akkar-folder-contents {
            display: none !important;
        }

        /* Løse strømmer mellom mapper blir svært kompakte mens en mappe flyttes.
           De beholder plassen sin i rekkefølgen, men tar nesten ingen høyde. */
        body.akkar-folder-sort-dragging .akkar-between-folders-zone .akkar-feed-row {
            height: 8px !important;
            min-height: 8px !important;
            max-height: 8px !important;
            margin: 1px 0 !important;
            padding: 0 !important;
            gap: 0 !important;
            overflow: hidden !important;
            border-radius: 999px !important;
            background: rgba(169, 132, 60, .20) !important;
            box-shadow: none !important;
            transition:
                height .12s ease,
                min-height .12s ease,
                max-height .12s ease,
                margin .12s ease;
        }

        body.akkar-folder-sort-dragging .akkar-between-folders-zone .akkar-feed-row > * {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .akkar-folder-icon {
            background: #151F3C;
        }

        html.dark .akkar-folder-icon {
            background: #ffffff;
        }

        /* Trykk-og-hold skal gjøre elementet mørkere, ikke lysere. */
        .akkar-folder-drag-handle:active,
        .akkar-feed-row:active {
            background: #c8d6ea !important;
        }

        html.dark .akkar-folder-drag-handle:active,
        html.dark .akkar-feed-row:active {
            background: #08132f !important;
        }

        /* Skalerbare artikkelkort. Verdiene styres per aktiv strøm. */
        .akkar-compact-card .akkar-compact-thumb {
            width: calc(124px * var(--akkar-card-scale, 1));
        }

        .akkar-compact-card .akkar-compact-body {
            height: calc(132px * var(--akkar-card-scale, 1));
        }

        .akkar-compact-card .akkar-compact-meta {
            font-size: calc(10px * var(--akkar-text-scale, 1));
        }

        .akkar-compact-card .akkar-compact-title {
            font-size: calc(15px * var(--akkar-text-scale, 1));
        }

        .akkar-compact-card .akkar-compact-summary {
            font-size: calc(13.5px * var(--akkar-text-scale, 1));
        }

        .akkar-large-card .akkar-large-meta {
            font-size: calc(11px * var(--akkar-text-scale, 1));
        }

        .akkar-large-card .akkar-large-title {
            font-size: calc(20px * var(--akkar-text-scale, 1));
        }

        @media (min-width: 640px) {
            .akkar-compact-card .akkar-compact-thumb {
                width: calc(154px * var(--akkar-card-scale, 1));
            }

            .akkar-compact-card .akkar-compact-body {
                height: calc(162px * var(--akkar-card-scale, 1));
            }

            .akkar-compact-card .akkar-compact-meta {
                font-size: calc(11px * var(--akkar-text-scale, 1));
            }

            .akkar-compact-card .akkar-compact-title {
                font-size: calc(16px * var(--akkar-text-scale, 1));
            }

            .akkar-compact-card .akkar-compact-summary {
                font-size: calc(14.5px * var(--akkar-text-scale, 1));
            }

            .akkar-large-card .akkar-large-title {
                font-size: calc(24px * var(--akkar-text-scale, 1));
            }
        }

        .akkar-folder-drag-handle {
            cursor: grab;
        }

        .akkar-folder-drag-handle:active {
            cursor: grabbing;
        }

        body.akkar-folder-sort-dragging,
        body.akkar-folder-sort-dragging * {
            cursor: grabbing !important;
            cursor: -webkit-grabbing !important;
        }

        .akkar-folder-sort-ghost {
            opacity: 0.16 !important;
        }

        .akkar-folder-sort-chosen {
            opacity: 0.34 !important;
        }

        .akkar-folder-sort-fallback {
            opacity: 1 !important;
            background: #ffffff !important;
            border: 1px solid #db7fa0 !important;
            border-radius: 10px !important;
            box-shadow: 0 14px 32px rgba(0,0,0,.28) !important;
            z-index: 9999 !important;
        }

        html.dark .akkar-folder-sort-fallback {
            background: #0c1a3c !important;
            border-color: #7e1335 !important;
        }

    </style>

    <script>
        (function () {
            function showBootError(message) {
                var el = document.getElementById('boot-status');
                if (!el) return;
                el.style.display = 'flex';
                el.style.opacity = '1';
                el.style.padding = '24px';
                el.style.textAlign = 'center';
                el.style.whiteSpace = 'pre-wrap';
                el.textContent = 'Akkar kunne ikke starte.\n' + message;
            }

            window.addEventListener('error', function (event) {
                if (event && event.message) showBootError(event.message);
            });

            window.addEventListener('unhandledrejection', function (event) {
                var reason = event && event.reason;
                showBootError(reason && reason.message ? reason.message : 'Ukjent JavaScript-feil');
            });

            window.__hideAkkarBoot = function () {
                var el = document.getElementById('boot-status');
                if (!el) return;
                el.style.opacity = '0';
                el.style.pointerEvents = 'none';
                setTimeout(function () {
                    if (el.style.opacity === '0') el.style.display = 'none';
                }, 240);
            };
        })();
    </script>

        const getFaviconUrl = (url) => {
            try {
                const parsed = new URL((url || '').trim());
                const sourceUrl = `${parsed.protocol}//${parsed.hostname}`;

                // Hent favicon for selve kilden. Google sin favicon-tjeneste brukes
                // som en robust mellomtjener, slik at vi ikke er avhengige av at
                // nettstedet faktisk har /favicon.ico på standardplasseringen.
                return `https://www.google.com/s2/favicons?domain_url=${encodeURIComponent(sourceUrl)}&sz=64`;
            } catch {
                return '';
            }
        };

        const normalizeBlueskyProfile = (value) => {
            const raw = (value || '').trim();
            if (!raw) return null;

            if (raw.startsWith('@')) {
                const handle = raw.slice(1).trim();
                return handle ? `https://bsky.app/profile/${handle}` : null;
            }

            try {
                const parsed = new URL(raw);
                const host = parsed.hostname.toLowerCase();
                if (host === 'bsky.app' || host === 'www.bsky.app') {
                    const parts = parsed.pathname.split('/').filter(Boolean);
                    const i = parts.indexOf('profile');
                    if (i !== -1 && parts[i + 1]) {
                        return `https://bsky.app/profile/${parts[i + 1]}`;
                    }
                }
            } catch {
                if (/^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$/i.test(raw)) {
                    return `https://bsky.app/profile/${raw}`;
                }
            }

            return null;
        };

        const blueskyProfileToRss = (value) => {
            const profileUrl = normalizeBlueskyProfile(value);
            return profileUrl ? `${profileUrl}/rss` : null;
        };

        const normalizeMastodonProfile = (value) => {
            const raw = (value || '').trim();
            if (!raw) return null;

            try {
                const parsed = new URL(raw);
                const parts = parsed.pathname.split('/').filter(Boolean);
                const userPart = parts.find(part => part.startsWith('@'));
                if (!userPart) return null;
                return `${parsed.origin}/${userPart}`;
            } catch {
                return null;
            }
        };

        const mastodonProfileToRss = (value) => {

        const redditToRss = (value) => {

                subreddit = raw.split('/')[1];
            } else if (/^[A-Za-z0-9_]+$/.test(raw)) {
                subreddit = raw;
            } else {
                try {
                    const parsed = new URL(raw);
                    if (!parsed.hostname.toLowerCase().includes('reddit.com')) return null;
                    const parts = parsed.pathname.split('/').filter(Boolean);
                    const rIndex = parts.findIndex(part => part.toLowerCase() === 'r');

                } catch {
                    return null;
                }
            }

            return subreddit ? `https://www.reddit.com/r/${subreddit}/.rss` : null;
        };

                if (!host.includes('substack.com') && !parsed.pathname.includes('/feed')) {

                `https://corsproxy.io/?${encodeURIComponent(url)}`
            ];

            for (const target of targets) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);

                try {
                    const res = await fetch(target, {
                        signal: controller.signal,
                        cache: 'no-store'
                    });
                    if (!res.ok) continue;

                    const text = await res.text();
                    if (text && text.length > 100) return text;

                    clearTimeout(timeoutId);
                }
            }

            return '';

        const normalizeWebsiteUrl = (value) => {
            const raw = (value || '').trim();
            if (!raw) return null;

            try {
                return new URL(raw).href;
            } catch {}

            // Tillat vanlige domener uten https://, f.eks. nrk.no
            if (/^(?:www\.)?[a-z0-9][a-z0-9.-]*\.[a-z]{2,}(?:\/.*)?$/i.test(raw)) {
                try {
                    return new URL(`https://${raw}`).href;
                } catch {}
            }

            return null;
        };

        const discoverFeedsFromWebsite = async (value) => {
            const raw = (value || '').trim();
            if (!raw) return [];

            const pageUrl = normalizeWebsiteUrl(raw);
            if (!pageUrl) return [];

            const html = await fetchPageText(pageUrl);

            const results = [];
            const seen = new Set();

            const addResult = (feedUrl, title = '', type = '') => {
                if (!feedUrl) return;

                let absoluteUrl = '';
                try {
                    absoluteUrl = new URL(feedUrl, pageUrl).href;
                } catch {
                    return;
                }

                const key = absoluteUrl.toLowerCase();
                if (seen.has(key)) return;
                seen.add(key);

                results.push({
                    feedUrl: absoluteUrl,
                    title: title || '',
                    type: (type || '').toLowerCase(),
                    discoveredFrom: pageUrl
                });
            };

            const headSample = html ? html.slice(0, 2000).toLowerCase() : '';

            // Direkte RSS/Atom-adresse
            if (
                headSample.includes('<rss') ||
                headSample.includes('<feed') ||
                headSample.includes('<rdf:rdf')
            ) {
                addResult(
                    pageUrl,
                    '',
                    headSample.includes('<feed')
                        ? 'application/atom+xml'
                        : 'application/rss+xml'
                );
                return results;
            }

            // Feeder annonsert i HTML-head
            try {
                if (!html) throw new Error('Ingen HTML fra nettsiden');
                const doc = new DOMParser().parseFromString(html, 'text/html');

                Array.from(
                    doc.querySelectorAll(
                        'link[rel~="alternate"][type="application/rss+xml"],' +
                        'link[rel~="alternate"][type="application/atom+xml"],' +
                        'link[rel~="alternate"][type="application/rdf+xml"],' +
                        'link[rel~="alternate"][type="text/xml"]'
                    )
                ).forEach(link => {
                    addResult(
                        link.getAttribute('href'),
                        (link.getAttribute('title') || '').trim(),
                        link.getAttribute('type') || ''
                    );
                });
            } catch {}

            // Vanlige fallback-adresser
            let origin = '';
            try {
                origin = new URL(pageUrl).origin;
            } catch {
                return results;
            }

            const fallbackPaths = [
                '/feed',
                '/feed/',
                '/rss',
                '/rss/',
                '/rss.xml',
                '/feed.xml',
                '/atom.xml',
                '/feeds/general.xml',
                '/feeds/rss.xml',
                '/feeds/news.xml',
                '/feeds/latest.xml',
                '/index.xml'
            ];

            const host = (() => {
                try { return new URL(pageUrl).hostname.replace(/^www\./, '').toLowerCase(); }
                catch { return ''; }
            })();

            const domainSpecificPaths = {
                'tek.no': ['/feeds/general.xml']
            };

            const pathsToTry = [
                ...(domainSpecificPaths[host] || []),
                ...fallbackPaths
            ].filter((path, index, arr) => arr.indexOf(path) === index);

            for (const path of pathsToTry) {
                const candidateUrl = `${origin}${path}`;
                if (seen.has(candidateUrl.toLowerCase())) continue;

                try {
                    const feedText = await fetchPageText(candidateUrl);
                    const sample = feedText.slice(0, 2000).toLowerCase();

                    if (
                        sample.includes('<rss') ||
                        sample.includes('<feed') ||
                        sample.includes('<rdf:rdf')
                    ) {
                        addResult(
                            candidateUrl,
                            '',
                            sample.includes('<feed')
                                ? 'application/atom+xml'
                                : 'application/rss+xml'
                        );
                    }
                } catch {}
            }

            return results;
        };

                    feedUrl: `https://www.youtube.com/feeds/videos.xml?channel_id=${raw}`,
                    sourceUrl: `https://www.youtube.com/channel/${raw}`,
                    title: raw
                };
            }

            try {
                const parsed = new URL(raw);

                if (parsed.pathname.includes('/feeds/videos.xml')) {
                    const id = parsed.searchParams.get('channel_id');
                    return {
                        feedUrl: raw,
                        sourceUrl: id ? `https://www.youtube.com/channel/${id}` : raw,
                        title: id || 'YouTube'
                    };
                }

                const directMatch = parsed.pathname.match(/\/channel\/(UC[A-Za-z0-9_-]+)/);
                if (directMatch) {
                    const channelId = directMatch[1];
                    return {
                        feedUrl: `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`,
                        sourceUrl: `https://www.youtube.com/channel/${channelId}`,
                        title: channelId
                    };
                }

                if (!parsed.hostname.toLowerCase().includes('youtube.com')) return null;

                const pageUrl = `${parsed.origin}${parsed.pathname}`;
                const html = await fetchPageText(pageUrl);
                if (!html) return null;

                    /"browseId":"(UC[A-Za-z0-9_-]+)"/,
                    /channel_id=(UC[A-Za-z0-9_-]+)/
                ];

                for (const pattern of patterns) {
                    const match = html.match(pattern);
                    if (match) {
                        const channelId = match[1];
                        return {
                            feedUrl: `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`,

            if (!dateString) return '';
            try {

                if (isNaN(published.getTime())) return '';

                const diffMs = Math.max(0, Date.now() - published.getTime());
                const minutes = Math.floor(diffMs / 60000);

                if (minutes < 1) return 'nå';
                if (minutes < 60) return `${minutes} min siden`;

                const hours = Math.floor(minutes / 60);
                if (hours < 24) return `${hours} t siden`;

                const days = Math.floor(hours / 24);
                if (days < 7) return `${days} d siden`;

                const weeks = Math.floor(days / 7);
                if (weeks < 5) return `${weeks} u siden`;

                const months = Math.floor(days / 30);
                if (months < 12) return `${months} mnd siden`;

                return `${years} år siden`;

        const cleanRssSummary = (html) => {
            if (!html) return '';

            try {
                const doc = new DOMParser().parseFromString(`<div id="akkar-summary-root">${html}</div>`, 'text/html');
                const root = doc.getElementById('akkar-summary-root');
                if (!root) return '';

                root.querySelectorAll(
                    'figure, figcaption, picture, img, source, video, svg, ' +
                    '[class*="caption" i], [class*="credit" i], [class*="photo" i], ' +
                    '[class*="image" i], [class*="fotograf" i], [class*="bildetekst" i], ' +
                    '[id*="caption" i], [id*="credit" i], [id*="photo" i], [id*="image" i]'
                ).forEach(el => el.remove());

                let text = (root.textContent || '')
                    .replace(/\s+/g, ' ')
                    .trim();

                // Dekod dobbelt-kodede HTML-entiteter (f.eks. &laquo; / &raquo; fra RSS).
                if (/&(?:[a-z]+|#\d+|#x[0-9a-f]+);/i.test(text)) {
                    const decodedDoc = new DOMParser().parseFromString(`<div id="akkar-dec">${text}</div>`, 'text/html');
                    text = (decodedDoc.getElementById('akkar-dec')?.textContent || text)
                        .replace(/\s+/g, ' ')
                        .trim();
                }

                text = text
                    .replace(/\s*(?:Foto|Photo|Bilde|Bildetekst|Image|Illustrasjon|Kreditering|Credit)\s*:\s*.*$/i, '')
                    .replace(/\s*©\s*[^.!?]+$/i, '')
                    .trim();

                return text;
            } catch (e) {
                return String(html)
                    .replace(/<figcaption\b[^>]*>[\s\S]*?<\/figcaption>/gi, ' ')
                    .replace(/<figure\b[^>]*>[\s\S]*?<\/figure>/gi, ' ')
                    .replace(/<[^>]+>/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();
            }
        };

        const stableArticleId = (feedId, url) => {
            const input = `${feedId}|${url || ''}`;
            let hash = 2166136261;

            for (let i = 0; i < input.length; i++) {
                hash ^= input.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }

            return `art-${feedId}-${(hash >>> 0).toString(36)}`;
        };

        const parseRssXml = (rawText, feedId, feedTitle) => {
            if (!rawText || typeof rawText !== 'string') return [];

            try {
                let cleanText = rawText.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
                cleanText = cleanText.replace(/&(?!(amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);)/g, '&amp;');

                const parser = new DOMParser();
                let xmlDoc = parser.parseFromString(cleanText, "text/xml");

                const hasParseError = xmlDoc.querySelector("parsererror");
                if (hasParseError || (!xmlDoc.getElementsByTagName("item").length && !xmlDoc.getElementsByTagName("entry").length)) {
                    xmlDoc = parser.parseFromString(cleanText, "text/html");
                }

                let items = Array.from(xmlDoc.querySelectorAll("item, entry"));
                
                return items.map((item, idx) => {
                    const getTagText = (selectorNames) => {
                        for (let name of selectorNames) {
                            let el = item.querySelector(name);
                            if (el && el.textContent) return el.textContent.trim();
                        }
                        return '';
                    };

                    const title = getTagText(['title']) || 'Uten tittel';

                    let url = '';
                    const linkEl = item.querySelector("link");
                    if (linkEl) {
                        url = linkEl.getAttribute("href") || linkEl.textContent?.trim() || '';
                    }
                    if (!url) url = getTagText(['guid', 'id']);
                    if (!url || !/^https?:\/\//i.test(url)) {
                        return null;
                    }

                    let rawDesc = getTagText(['content\\:encoded', 'encoded', 'content', 'description', 'summary']);
                    if (!rawDesc) {
                        const descEl = item.querySelector('description') || item.querySelector('summary');
                        if (descEl) rawDesc = descEl.innerHTML || descEl.textContent || '';
                    }

                    let cleanSummary = cleanRssSummary(rawDesc);
                    cleanSummary = cleanSummary.slice(0, 250) + (cleanSummary.length > 250 ? '...' : '');

                    let pubDate = getTagText(['pubDate', 'published', 'updated', 'dc\\:date', 'date']) || new Date(Date.now() - idx * 1800000).toISOString();

                    let imageUrl = '';

                    // RSS-feeder bruker flere ulike felter for artikkelbilder.
                    // Tek.no bruker ikke nødvendigvis bare enclosure/media:content,
                    // derfor sjekker vi også media:thumbnail og andre vanlige varianter.
                    const imageCandidates = [
                        'media\\:thumbnail',
                        'media\\:content',
                        'enclosure',
                        'content[url]',
                        'image',
                        'itunes\\:image'
                    ];

                    for (const selector of imageCandidates) {
                        const elements = Array.from(item.querySelectorAll(selector));

                        for (const element of elements) {
                            const type = (element.getAttribute('type') || '').toLowerCase();
                            const medium = (element.getAttribute('medium') || '').toLowerCase();

                            // For enclosure: hopp over lyd/video når MIME-type er kjent.
                            if (
                                selector === 'enclosure' &&
                                type &&
                                !type.startsWith('image/')
                            ) {
                                continue;
                            }

                            if (
                                selector === 'media\\:content' &&
                                medium &&
                                medium !== 'image'
                            ) {
                                continue;
                            }

                            const candidate =
                                element.getAttribute('url') ||
                                element.getAttribute('href') ||
                                element.getAttribute('src') ||
                                element.querySelector?.('url')?.textContent?.trim() ||
                                '';

                            if (candidate && /^https?:\/\//i.test(candidate)) {
                                imageUrl = candidate;
                                break;
                            }
                        }

                        if (imageUrl) break;
                    }

                    if (!imageUrl) {
                        const imgMatch = rawDesc.match(/<img[^>]+(?:src|data-src|data-original)=["']([^"']+)["']/i);
                        if (imgMatch) imageUrl = imgMatch[1];
                    }

                    // Enkel støtte for srcset dersom beskrivelsen bare bruker det.
                    if (!imageUrl) {
                        const srcsetMatch = rawDesc.match(/<img[^>]+srcset=["']([^"']+)["']/i);
                        if (srcsetMatch) {
                            const firstCandidate = srcsetMatch[1]
                                .split(',')
                                .map(part => part.trim().split(/\s+/)[0])
                                .find(Boolean);

                            if (firstCandidate) imageUrl = firstCandidate;
                        }
                    }

                    const author = getTagText(['author', 'dc\\:creator', 'creator']) || feedTitle;

                    return {
                        id: stableArticleId(feedId, url),
                        feedId: feedId,
                        feedTitle: feedTitle,
                        title: title,
                        summary: cleanSummary || title,
                        content: rawDesc || cleanSummary || title,
                        url: url,
                        author: author,
                        pubDate: pubDate,
                        imageUrl: imageUrl || APP_LOGO,
                        read: false,
                        starred: false
                    };
                }).filter(Boolean);
            } catch (e) {
                console.error("RSS Parsing error:", e);
                return [];
            }
        };

        const parseRss2Json = (payload, feedId, feedTitle) => {
            if (!payload || !Array.isArray(payload.items)) return [];

            return payload.items.map((item, idx) => {
                const itemUrl = item.link || item.guid || '';
                if (!/^https?:\/\//i.test(itemUrl)) return null;

                const rawDesc = item.content || item.description || '';
                const cleanSummary = cleanRssSummary(rawDesc);

                let imageUrl =
                    item.thumbnail ||
                    item.enclosure?.link ||
                    item.enclosure?.url ||
                    item.media?.thumbnail ||
                    item.media?.content ||
                    '';

                if (!imageUrl) {
                    const imgMatch = rawDesc.match(/<img[^>]+(?:src|data-src|data-original)=["']([^"']+)["']/i);
                    if (imgMatch) imageUrl = imgMatch[1];
                }

                if (!imageUrl) {
                    const srcsetMatch = rawDesc.match(/<img[^>]+srcset=["']([^"']+)["']/i);
                    if (srcsetMatch) {
                        imageUrl = srcsetMatch[1]
                            .split(',')
                            .map(part => part.trim().split(/\s+/)[0])
                            .find(Boolean) || '';
                    }
                }

                return {
                    id: stableArticleId(feedId, itemUrl),
                    feedId,
                    feedTitle,
                    title: item.title || 'Uten tittel',
                    summary: (cleanSummary || item.title || '').slice(0, 250),
                    content: rawDesc || cleanSummary || item.title || '',
                    url: itemUrl,
                    author: item.author || feedTitle,
                    pubDate: item.pubDate || new Date().toISOString(),
                    imageUrl: imageUrl || APP_LOGO,
                    read: false,
                    starred: false
                };
            }).filter(Boolean);
        };

        const getBlueskyActor = (feed) => {
            const candidates = [
                feed?.sourceUrl,
                feed?.url
            ].filter(Boolean);

            for (const candidate of candidates) {
                try {
                    const parsed = new URL(candidate);
                    const parts = parsed.pathname.split('/').filter(Boolean);
                    const profileIndex = parts.findIndex(part => part.toLowerCase() === 'profile');

                    if (profileIndex !== -1 && parts[profileIndex + 1]) {
                        return decodeURIComponent(parts[profileIndex + 1]);
                    }

                    if (
                        parsed.hostname.toLowerCase().includes('bsky.app') &&
                        parts[0] &&
                        !['rss', 'profile'].includes(parts[0].toLowerCase())
                    ) {
                        return decodeURIComponent(parts[0]);
                    }
                } catch {}

                const raw = String(candidate || '').trim();
                if (/^did:plc:[a-z0-9]+$/i.test(raw)) return raw;
                if (/^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$/i.test(raw)) return raw;
            }

            return '';
        };

        const getBlueskyImage = (post) => {
            const embed = post?.embed;
            if (!embed) return '';

            if (Array.isArray(embed.images) && embed.images[0]) {
                return embed.images[0].thumb || embed.images[0].fullsize || '';
            }

            if (embed.external?.thumb) return embed.external.thumb;

            if (embed.media) {
                if (Array.isArray(embed.media.images) && embed.media.images[0]) {
                    return embed.media.images[0].thumb || embed.media.images[0].fullsize || '';
                }
                if (embed.media.external?.thumb) return embed.media.external.thumb;
            }

            return '';
        };

        const parseBlueskyAuthorFeed = (payload, feedId, feedTitle) => {
            if (!payload || !Array.isArray(payload.feed)) return [];

            return payload.feed.map((entry, idx) => {
                const post = entry?.post;
                const record = post?.record || {};
                const text = String(record.text || '').trim();
                const uri = String(post?.uri || '');
                const rkey = uri.split('/').filter(Boolean).pop() || '';
                const handle = post?.author?.handle || '';
                const did = post?.author?.did || '';
                const actorForUrl = handle || did;

                if (!actorForUrl || !rkey) return null;

                const postUrl = `https://bsky.app/profile/${encodeURIComponent(actorForUrl)}/post/${encodeURIComponent(rkey)}`;
                const cleanText = cleanRssSummary(text);
                const firstLine = cleanText.split(/\r?\n/).map(line => line.trim()).find(Boolean) || '';
                const title = firstLine.length > 140
                    ? `${firstLine.slice(0, 137)}...`
                    : (firstLine || `${feedTitle} på Bluesky`);

                return {
                    id: stableArticleId(feedId, postUrl),
                    feedId,
                    feedTitle,
                    title,
                    summary: cleanText.slice(0, 250) + (cleanText.length > 250 ? '...' : ''),
                    content: text || cleanText || title,
                    url: postUrl,
                    author: post?.author?.displayName || post?.author?.handle || feedTitle,
                    pubDate: record.createdAt || post?.indexedAt || new Date(Date.now() - idx * 1800000).toISOString(),
                    imageUrl: getBlueskyImage(post) || APP_LOGO,
                    read: false,
                    starred: false
                };
            }).filter(Boolean);
        };

        const fetchBlueskyAuthorFeed = async (feed, feedId, feedTitle) => {
            const actor = getBlueskyActor(feed);
            if (!actor) return [];

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3500);

            try {
                const apiUrl =
                    `https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed` +
                    `?actor=${encodeURIComponent(actor)}` +
                    `&limit=50`;

                const res = await fetch(apiUrl, {
                    signal: controller.signal,
                    cache: 'no-store',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!res.ok) return [];

                const json = await res.json();
                return parseBlueskyAuthorFeed(json, feedId, feedTitle);
            } catch {
                return [];
            } finally {
                clearTimeout(timeoutId);
            }
        };

        const fetchFeedArticles = async (feedUrl, feedId, feedTitle, feedMeta = null, onStatus = null) => {
            const sortArticles = (items) =>
                (Array.isArray(items) ? items : []).sort((a, b) =>
                    (new Date(b.pubDate).getTime() || 0) -
                    (new Date(a.pubDate).getTime() || 0)
                );

            // Bluesky bruker offentlig AppView-API, som normalt er raskest og mest robust.
            const isBlueskyFeed =
                feedMeta?.type === 'bluesky' ||
                /bsky\.app\/profile\//i.test(feedMeta?.sourceUrl || '') ||
                /bsky\.app\/profile\//i.test(feedUrl || '');

            if (isBlueskyFeed) {
                const blueskyArticles = await fetchBlueskyAuthorFeed(
                    feedMeta || { url: feedUrl },
                    feedId,
                    feedTitle
                );

                if (blueskyArticles.length > 0) {
                    onStatus?.({ ok: true, feedId });
                    return sortArticles(blueskyArticles);
                }
            }

            const cacheBust = `_akkar=${Date.now()}`;
            const freshFeedUrl =
                feedUrl + (feedUrl.includes('?') ? '&' : '?') + cacheBust;

            const fetchXml = async (url, timeout = 3500) => {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);

                try {
                    const res = await fetch(url, {
                        signal: controller.signal,
                        cache: 'no-store',
                        headers: {
                            'Accept': 'application/rss+xml, application/atom+xml, application/xml, text/xml, */*'
                        }
                    });

                    if (!res.ok) return [];

                    const text = await res.text();
                    if (!text || text.trim().length < 50) return [];

                    const parsed = parseRssXml(text, feedId, feedTitle);
                    return Array.isArray(parsed) ? parsed : [];
                } catch {
                    return [];
                } finally {
                    clearTimeout(timeoutId);
                }
            };

            // Rask direkte prøve først. CORS-feil kommer vanligvis umiddelbart,
            // mens en treg server får maksimalt 1,5 sekunder til å svare.
            const directArticles = await fetchXml(freshFeedUrl, 1500);
            if (directArticles.length > 0) {
                onStatus?.({ ok: true, feedId });
                return sortArticles(directArticles);
            }

            // Prøv egen RSS-proxy på Mac Mini først (unngår CORS-blokkering og 429/403 fra offentlige proxyer).
            try {
                const savedTts = JSON.parse(localStorage.getItem('akkar_tts_settings') || '{}');
                const isLocal = typeof window !== 'undefined' && (
                    window.location.hostname === 'localhost' ||
                    window.location.hostname === '127.0.0.1' ||
                    window.location.hostname.startsWith('192.168.')
                );
                const proxyBase = String(
                    savedTts.serverUrl || (isLocal ? 'http://192.168.10.199:7860' : 'https://tts.autobot.no')
                ).replace(/\/+$/, '');
                if (proxyBase) {
                    const headers = { 'Accept': 'application/rss+xml, application/atom+xml, application/xml, text/xml, */*' };
                    if (savedTts.password) {
                        const tok = btoa(unescape(encodeURIComponent(`${savedTts.username || 'peter'}:${savedTts.password}`)));
                        headers['Authorization'] = `Basic ${tok}`;
                    }
                    const ctrl = new AbortController();
                    const tId = setTimeout(() => ctrl.abort(), 5000);
                    try {
                        const res = await fetch(`${proxyBase}/api/rss?url=${encodeURIComponent(freshFeedUrl)}`, {
                            signal: ctrl.signal,
                            cache: 'no-store',
                            headers,
                        });
                        if (res.ok) {
                            const text = await res.text();
                            const parsed = text && text.trim().length >= 50 ? parseRssXml(text, feedId, feedTitle) : [];
                            if (Array.isArray(parsed) && parsed.length > 0) {
                                onStatus?.({ ok: true, feedId });
                                return sortArticles(parsed);
                            }
                        }
                    } finally {
                        clearTimeout(tId);
                    }
                }
            } catch {}

            // Hvis direkte henting ikke virker, prøves reservekildene samtidig.
            // Første gyldige svar vinner. Resten trenger ikke forsinke oppdateringen.
            const controllers = [];
            const makeController = (timeout = 3500) => {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);
                controllers.push({ controller, timeoutId });
                return controller;
            };

            const textFallbacks = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(freshFeedUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(freshFeedUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(freshFeedUrl)}`
            ];

            const fallbackPromises = textFallbacks.map(url => (async () => {
                const controller = makeController();

                try {
                    const res = await fetch(url, {
                        signal: controller.signal,
                        cache: 'no-store',
                        headers: {
                            'Accept': 'application/rss+xml, application/atom+xml, application/xml, text/xml, */*'
                        }
                    });

                    if (!res.ok) throw new Error('HTTP-feil');

                    const text = await res.text();
                    if (!text || text.trim().length < 50) {
                        throw new Error('Tom RSS');
                    }

                    const parsed = parseRssXml(text, feedId, feedTitle);
                    if (!Array.isArray(parsed) || parsed.length === 0) {
                        throw new Error('Ingen artikler');
                    }

                    return parsed;
                } catch (error) {
                    throw error;
                }
            })());

            fallbackPromises.push((async () => {
                const controller = makeController();

                try {
                    const url =
                        `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;

                    const res = await fetch(url, {
                        signal: controller.signal,
                        cache: 'no-store'
                    });

                    if (!res.ok) throw new Error('HTTP-feil');

                    const json = await res.json();
                    if (json.status && json.status !== 'ok') {
                        throw new Error('RSS2JSON-feil');
                    }

                    const parsed = parseRss2Json(json, feedId, feedTitle);
                    if (!Array.isArray(parsed) || parsed.length === 0) {
                        throw new Error('Ingen artikler');
                    }

                    return parsed;
                } catch (error) {
                    throw error;
                }
            })());

            try {
                const firstValid = await Promise.any(fallbackPromises);

                // Avbryt reservekallene som fortsatt pågår når én kilde har svart.
                controllers.forEach(({ controller, timeoutId }) => {
                    clearTimeout(timeoutId);
                    if (!controller.signal.aborted) controller.abort();
                });

                onStatus?.({ ok: true, feedId });
                return sortArticles(firstValid);
            } catch {
                controllers.forEach(({ controller, timeoutId }) => {
                    clearTimeout(timeoutId);
                    if (!controller.signal.aborted) controller.abort();
                });

                onStatus?.({ ok: false, feedId });
                return [];
            }
        };


        const normalizeStoryTitle = (title = '') => {
            const stopWords = new Set([
                'og','i','på','av','for','til','med','om','en','et','ei','den','det','de',
                'som','er','har','fra','etter','før','kan','skal','vil','ble','blir','mot',
                'ved','over','under','nå','ny','nye','sier','får','ikke','the','a','an','and',
                'of','to','in','on','for','with','from','is','are','was','were','will'
            ]);

            return String(title)
                .toLocaleLowerCase('nb-NO')
                .normalize('NFKD')
                .replace(/[^\p{L}\p{N}\s]/gu, ' ')
                .split(/\s+/)
                .map(word => word.trim())
                .filter(word => word.length > 1 && !stopWords.has(word));
        };

        const storySimilarityFromTokenSets = (aSet, bSet, sharedCount = null) => {
            if (!aSet || !bSet || aSet.size < 3 || bSet.size < 3) return 0;

            const shared = sharedCount ?? [...aSet].filter(token => bSet.has(token)).length;
            if (shared < 3) return 0;

            const unionSize = aSet.size + bSet.size - shared;
            const jaccard = unionSize ? shared / unionSize : 0;
            const containment = shared / Math.min(aSet.size, bSet.size);

            return Math.max(jaccard, containment * 0.9);
        };

        const normalizeArticleDedupeUrl = (rawUrl) => {
            if (!rawUrl) return '';
            try {
                const u = new URL(rawUrl.trim());
                ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'fbclid', 'gclid'].forEach(p => u.searchParams.delete(p));
                return (u.hostname.replace(/^www\./, '').toLowerCase() + u.pathname.replace(/\/+$/, '') + u.search).toLowerCase();
            } catch {
                return rawUrl.trim().toLowerCase().replace(/^https?:\/\/(www\.)?/, '').replace(/[?#].*$/, '').replace(/\/+$/, '');
            }
        };

        const groupSimilarStories = (items) => {
            const groups = [];
            const tokenIndex = new Map();
            const urlIndex = new Map();
            const exactTitleIndex = new Map();
            const exactSummaryIndex = new Map();
            const MAX_TIME_DISTANCE = 72 * 60 * 60 * 1000;
            const MATCH_THRESHOLD = 0.62;
            const SAME_FEED_MATCH_THRESHOLD = 0.82;

            items.forEach(article => {
                const articleTime = new Date(article.pubDate).getTime() || 0;
                const normUrl = normalizeArticleDedupeUrl(article.url);
                const exactTitleKey = (article.title || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
                const cleanSum = cleanRssSummary(article.summary || article.content || '')
                    .toLowerCase()
                    .replace(/[^\p{L}\p{N}]+/gu, ' ')
                    .trim();
                const exactSummaryKey = cleanSum.length >= 60 ? cleanSum.slice(0, 90) : '';

                // 1. Eksakt samme normaliserte URL -> slå alltid sammen
                if (normUrl && urlIndex.has(normUrl)) {
                    const gIdx = urlIndex.get(normUrl);
                    groups[gIdx].articles.push(article);
                    return;
                }

                // 2. Eksakt samme tittel innenfor tidsvinduet -> slå sammen (også i samme feed)
                if (exactTitleKey.length >= 12 && exactTitleIndex.has(exactTitleKey)) {
                    const gIdx = exactTitleIndex.get(exactTitleKey);
                    const g = groups[gIdx];
                    if (!articleTime || !g.primaryTime || Math.abs(articleTime - g.primaryTime) <= MAX_TIME_DISTANCE) {
                        g.articles.push(article);
                        if (normUrl && !urlIndex.has(normUrl)) urlIndex.set(normUrl, gIdx);
                        return;
                    }
                }

                // 3. Eksakt samme ingress (f.eks. Polaris/MN24 + Adressa med ulik tittel) -> slå sammen
                if (exactSummaryKey && exactSummaryIndex.has(exactSummaryKey)) {
                    const gIdx = exactSummaryIndex.get(exactSummaryKey);
                    const g = groups[gIdx];
                    if (!articleTime || !g.primaryTime || Math.abs(articleTime - g.primaryTime) <= MAX_TIME_DISTANCE) {
                        g.articles.push(article);
                        if (normUrl && !urlIndex.has(normUrl)) urlIndex.set(normUrl, gIdx);
                        return;
                    }
                }

                const articleTokens = new Set(normalizeStoryTitle(article.title));

                const addGroup = () => {
                    const groupIndex = groups.length;
                    groups.push({
                        primary: article,
                        primaryTime: articleTime,
                        tokenSet: articleTokens,
                        articles: [article]
                    });

                    if (normUrl && !urlIndex.has(normUrl)) urlIndex.set(normUrl, groupIndex);
                    if (exactTitleKey.length >= 12 && !exactTitleIndex.has(exactTitleKey)) exactTitleIndex.set(exactTitleKey, groupIndex);
                    if (exactSummaryKey && !exactSummaryIndex.has(exactSummaryKey)) exactSummaryIndex.set(exactSummaryKey, groupIndex);

                    articleTokens.forEach(token => {
                        if (!tokenIndex.has(token)) tokenIndex.set(token, new Set());
                        tokenIndex.get(token).add(groupIndex);
                    });
                };

                if (articleTokens.size < 3) {
                    addGroup();
                    return;
                }

                // Bare grupper som deler minst tre ord blir kandidater.
                // Dette unngår å sammenligne hver artikkel mot alle tidligere grupper.
                const candidateSharedCounts = new Map();

                articleTokens.forEach(token => {
                    const matchingGroups = tokenIndex.get(token);
                    if (!matchingGroups) return;

                    matchingGroups.forEach(groupIndex => {
                        candidateSharedCounts.set(
                            groupIndex,
                            (candidateSharedCounts.get(groupIndex) || 0) + 1
                        );
                    });
                });

                let bestGroupIndex = -1;
                let bestScore = 0;

                candidateSharedCounts.forEach((sharedCount, groupIndex) => {
                    if (sharedCount < 3) return;

                    const group = groups[groupIndex];
                    if (!group) return;

                    if (
                        articleTime &&
                        group.primaryTime &&
                        Math.abs(articleTime - group.primaryTime) > MAX_TIME_DISTANCE
                    ) {
                        return;
                    }

                    const score = storySimilarityFromTokenSets(
                        articleTokens,
                        group.tokenSet,
                        sharedCount
                    );

                    const sameFeed = group.articles.some(item => item.feedId === article.feedId);
                    const requiredThreshold = sameFeed ? SAME_FEED_MATCH_THRESHOLD : MATCH_THRESHOLD;

                    if (score >= requiredThreshold && score > bestScore) {
                        bestScore = score;
                        bestGroupIndex = groupIndex;
                    }
                });

                if (bestGroupIndex >= 0) {
                    groups[bestGroupIndex].articles.push(article);
                    if (normUrl && !urlIndex.has(normUrl)) urlIndex.set(normUrl, bestGroupIndex);
                } else {
                    addGroup();
                }
            });

            return groups.map(group => ({
                ...group.primary,
                relatedArticles: group.articles.slice(1)
            }));
        };

        const articleMatchesBlockedWords = (article, blockedWords) => {
            if (!blockedWords?.length) return false;

            const searchableText = [
                article.title || '',
                article.summary || '',
                article.content || ''
            ].join(' ').toLocaleLowerCase('nb-NO');

            return blockedWords.some(word => {
                const cleanWord = String(word || '').trim();
                if (!cleanWord) return false;

                const escaped = cleanWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const exactWordPattern = new RegExp(
                    `(^|[^\\p{L}\\p{N}_])${escaped}(?=$|[^\\p{L}\\p{N}_])`,
                    'iu'
                );

                return exactWordPattern.test(searchableText);
            });
        };

        // Større datasett lagres i IndexedDB. localStorage beholdes for
        // små innstillinger og som fallback dersom IndexedDB ikke er tilgjengelig.
        const AKKAR_DB_NAME = 'akkar-rss-db';
        const AKKAR_DB_VERSION = 1;
        const AKKAR_DB_STORE = 'state';
        let akkarDbPromise = null;

        const openAkkarDb = () => {
            if (!('indexedDB' in window)) {
                return Promise.reject(new Error('IndexedDB er ikke tilgjengelig'));
            }

            if (!akkarDbPromise) {
                akkarDbPromise = new Promise((resolve, reject) => {
                    const request = indexedDB.open(AKKAR_DB_NAME, AKKAR_DB_VERSION);

                    request.onupgradeneeded = () => {
                        const db = request.result;
                        if (!db.objectStoreNames.contains(AKKAR_DB_STORE)) {
                            db.createObjectStore(AKKAR_DB_STORE);
                        }
                    };

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error || new Error('Kunne ikke åpne IndexedDB'));
                    request.onblocked = () => reject(new Error('IndexedDB er blokkert'));
                });
            }

            return akkarDbPromise;
        };

        const readAkkarDbValue = async (key) => {
            const db = await openAkkarDb();

            return new Promise((resolve, reject) => {
                const transaction = db.transaction(AKKAR_DB_STORE, 'readonly');
                const store = transaction.objectStore(AKKAR_DB_STORE);
                const request = store.get(key);

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error || new Error(`Kunne ikke lese ${key}`));
            });
        };

        const writeAkkarDbValue = async (key, value) => {
            const db = await openAkkarDb();

            return new Promise((resolve, reject) => {
                const transaction = db.transaction(AKKAR_DB_STORE, 'readwrite');
                const store = transaction.objectStore(AKKAR_DB_STORE);
                store.put(value, key);

                transaction.oncomplete = () => resolve();
                transaction.onerror = () => reject(transaction.error || new Error(`Kunne ikke lagre ${key}`));
                transaction.onabort = () => reject(transaction.error || new Error(`Lagring av ${key} ble avbrutt`));
            });
        };

        function AkkarApp() {
            const [folders, setFolders] = useState(() => {
                const saved = localStorage.getItem('akkar_folders_v3') || localStorage.getItem('vaak_folders_v3');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.length > 0) {
                            if (!localStorage.getItem(INOREADER_MIGRATION_KEY)) {
                                const merged = mergeMissingInitialFolders(parsed);
                                localStorage.setItem(INOREADER_MIGRATION_KEY, '1');
                                localStorage.setItem('akkar_folders_v3', JSON.stringify(merged));
                                return merged;
                            }
                            return parsed;
                        }
                    } catch (e) {}
                }
                localStorage.setItem(INOREADER_MIGRATION_KEY, '1');
                return INITIAL_FOLDERS;
            });

            const [articles, setArticles] = useState(() => {
                // En liten oppstartscache gjør at artikler kan vises synkront mens
                // hele databasen lastes fra IndexedDB i bakgrunnen.
                const saved =
                    localStorage.getItem('akkar_startup_articles') ||
                    localStorage.getItem('akkar_articles') ||
                    localStorage.getItem('vaak_articles');

                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.length > 0) {
                            return parsed.map(article => ({
                                ...article,
                                summary: cleanRssSummary(article.summary || article.content || '')
                            }));
                        }
                    } catch (e) {}
                }

                return [];
            });
            const [isStorageHydrated, setIsStorageHydrated] = useState(false);
            const [recentlyReadIds, setRecentlyReadIds] = useState(() => new Set());
            const sessionUnreadOverridesRef = useRef(new Set());
            const readUrlsRef = useRef((() => {
                try {
                    const raw = localStorage.getItem('akkar_read_urls_v1');
                    const parsed = raw ? JSON.parse(raw) : null;
                    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
                } catch {
                    return {};
                }
            })());

            const saveReadUrlsToStorage = () => {
                try {
                    const map = readUrlsRef.current || {};
                    const entries = Object.entries(map);
                    if (entries.length > 2500) {
                        entries.sort((a, b) => (b[1] || 0) - (a[1] || 0));
                        readUrlsRef.current = Object.fromEntries(entries.slice(0, 2500));
                    }
                    localStorage.setItem('akkar_read_urls_v1', JSON.stringify(readUrlsRef.current));
                } catch {}
            };

            const recordReadUrls = (urls, isRead) => {
                if (!urls || urls.length === 0) return;
                const map = { ...(readUrlsRef.current || {}) };
                const now = Date.now();
                let changed = false;
                for (const u of urls) {
                    if (!u) continue;
                    if (isRead) {
                        sessionUnreadOverridesRef.current.delete(u);
                        if (!map[u]) {
                            map[u] = now;
                            changed = true;
                        }
                    } else {
                        sessionUnreadOverridesRef.current.add(u);
                        if (map[u]) {
                            delete map[u];
                            changed = true;
                        }
                    }
                }
                if (changed) {
                    readUrlsRef.current = map;
                    saveReadUrlsToStorage();
                }
            };

            // UI State
            const firstFolder = folders.find(folder => folder.id !== UNGROUPED_FOLDER_ID) || null;
            const firstFeed = folders.flatMap(folder => folder.feeds || [])[0] || null;

                            setSharedSavedLoading(false);
                        }
                        return;
                    }

                        const match = hash.match(/^#saved=([ug])\.([A-Za-z0-9_-]+)$/);
                        if (!match) throw new Error('Ugyldig Lagret-lenke');

                        const mode = match[1];
                        let encoded = match[2].replace(/-/g, '+').replace(/_/g, '/');
                        while (encoded.length % 4) encoded += '=';

                        const binary = atob(encoded);
                        let bytes = Uint8Array.from(binary, char => char.charCodeAt(0));

                        if (mode === 'g') {
                            if (!('DecompressionStream' in window)) {
                                throw new Error('Nettleseren støtter ikke komprimerte Lagret-lenker');
                            }

                            const stream = new Blob([bytes])
                                .stream()
                                .pipeThrough(new DecompressionStream('gzip'));

                            bytes = new Uint8Array(await new Response(stream).arrayBuffer());
                        }

                        const decoded = new TextDecoder().decode(bytes);
                        const parsed = JSON.parse(decoded);

                        if (!Array.isArray(parsed)) {
                            throw new Error('Ugyldig Lagret-data');
                        }

                        if (!cancelled) {
                            setSharedSavedView(parsed);
                            setSharedSavedLoading(false);
                        }

                        console.warn('Kunne ikke åpne delt Lagret-visning:', e);

                            setSharedSavedView([]);
                            setSharedSavedLoading(false);
                        }
                    }
