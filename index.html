            };

            const fetchTtsJobStatus = async (jobId, signal) => {
                const cfg = ttsSettingsRef.current;
                const base = (cfg.serverUrl || '').replace(/\/+$/, '');
                const res = await fetch(`${base}/api/tts/job/${jobId}/status`, {
                    headers: getTtsHeaders(cfg),
                    signal,
                });
                if (res.status === 401) throw new Error('AUTH_REQUIRED');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            };

            const sleepWithSignal = (ms, signal) => new Promise((resolve, reject) => {
                if (signal?.aborted) return reject(new DOMException('Aborted', 'AbortError'));
                const t = setTimeout(() => {
                    signal?.removeEventListener('abort', onAbort);
                    resolve();
                }, ms);
                const onAbort = () => {
                    clearTimeout(t);
                    reject(new DOMException('Aborted', 'AbortError'));
                };
                signal?.addEventListener('abort', onAbort, { once: true });
            });

            const fetchTtsChunkUrl = (jobId, idx, signal) => {
                const key = `${jobId}:${idx}`;
                const existing = ttsPrefetchRef.current.get(key);
                if (existing?.promise) return existing.promise;

                const cfg = ttsSettingsRef.current;
                const base = (cfg.serverUrl || '').replace(/\/+$/, '');

                const promise = (async () => {
                    // Poll status til denne bolken er ferdig prosessert (unngår Cloudflare 100s timeout)
                    while (true) {
                        if (signal?.aborted || ttsActiveJobRef.current !== jobId) {
                            throw new DOMException('Aborted', 'AbortError');
                        }
                        const st = await fetchTtsJobStatus(jobId, signal);
                        if (st.error) throw new Error(st.error);
                        if (Array.isArray(st.ready_chunks) && st.ready_chunks.includes(idx)) {
                            break;
                        }
                        if (st.stopped || st.done) {
                            throw new Error('Opplesing avbrutt før denne delen ble klar.');
                        }
                        await sleepWithSignal(800, signal);
                    }

                    const res = await fetch(`${base}/api/tts/chunk/${jobId}/${idx}`, {
                        headers: getTtsHeaders(cfg),
                        signal,
                    });
                    if (res.status === 401) throw new Error('AUTH_REQUIRED');
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    ttsPrefetchRef.current.set(key, { promise: Promise.resolve(url), url });
                    return url;
                })();

                ttsPrefetchRef.current.set(key, { promise, url: null });
                return promise;
            };

            const playCachedMp3ByKey = async (cacheKey, durationHint, source, respChunks, signal) => {
                const cfg = ttsSettingsRef.current;
                const base = (cfg.serverUrl || '').replace(/\/+$/, '');
                const cacheJobId = `cached:${cacheKey}`;
                ttsActiveJobRef.current = cacheJobId;

                const mp3Res = await fetch(`${base}/api/tts/cached/${cacheKey}.mp3`, {
                    headers: getTtsHeaders(cfg),
                    signal,
                });
                if (!mp3Res.ok) throw new Error(`Kunne ikke hente ferdig MP3 (${mp3Res.status})`);
                const blob = await mp3Res.blob();
                if (ttsActiveJobRef.current !== cacheJobId) return;
                const blobUrl = URL.createObjectURL(blob);
                ttsPrefetchRef.current.set(cacheJobId, { promise: Promise.resolve(blobUrl), url: blobUrl });

                const audio = ttsAudioRef.current || new Audio();
                ttsAudioRef.current = audio;
                audio.src = blobUrl;
                audio.playbackRate = ttsSettingsRef.current.speed || 1.0;
                audio.preservesPitch = true;
                audio.webkitPreservesPitch = true;

                audio.ontimeupdate = () => {
                    if (ttsActiveJobRef.current === cacheJobId) {
                        setTtsState(prev => ({
                            ...prev,
                            currentTime: audio.currentTime || 0,
                            duration: Number.isFinite(audio.duration) ? audio.duration : (durationHint || 0),
                        }));
                    }
                };
                audio.onended = () => {
                    if (ttsActiveJobRef.current === cacheJobId) {
                        setTtsState(prev => ({ ...prev, isPlaying: false, status: 'Ferdig opplest' }));
                    }
                };
                audio.onerror = () => {
                    if (ttsActiveJobRef.current === cacheJobId) {
                        setTtsState(prev => ({ ...prev, isPlaying: false, isLoading: false, error: 'Kunne ikke spille av MP3.' }));
                    }
                };

                try {
                    await audio.play();
                    setTtsState(prev => ({
                        ...prev,
                        jobId: cacheJobId,
                        cached: true,
                        source: source || 'full_article',
                        duration: durationHint || 0,
                        currentTime: 0,
                        chunks: respChunks,
                        isLoading: false,
                        isPlaying: true,
                        status: 'Ferdig generert · Klar',
                        error: '',
                    }));
                } catch (playErr) {
                    if (playErr?.name === 'NotAllowedError') {
                        setTtsState(prev => ({
                            ...prev,
                            jobId: cacheJobId,
                            cached: true,
                            source: source || 'full_article',
                            duration: durationHint || 0,
                            currentTime: 0,
                            chunks: respChunks,
                            isLoading: false,
                            isPlaying: false,
                            status: 'Hele er klar – trykk Play for å starte',
                            error: '',
                        }));
                    } else {
                        throw playErr;
                    }
                }
            };

            const waitForFullJobAndPlay = async (jobId, totalChunks, source, respChunks, signal) => {
                ttsActiveJobRef.current = jobId;
                if (ttsAudioRef.current) {
                    ttsAudioRef.current.onended = null;
                    ttsAudioRef.current.pause();
                }
                while (true) {
                    if (signal?.aborted || ttsActiveJobRef.current !== jobId) return;
                    const st = await fetchTtsJobStatus(jobId, signal);
                    if (st.error) throw new Error(st.error);
                    if (st.stopped) return;
                    if (st.done && st.cache_key) {
                        await playCachedMp3ByKey(st.cache_key, st.duration, source, respChunks, signal);
                        return;
                    }
                    setTtsState(prev => prev.jobId === jobId ? {
                        ...prev,
                        isLoading: true,
                        isPlaying: false,
                        status: `Venter på hele artikkelen (${st.completed_count}/${totalChunks} deler)...`,
                        error: '',
                    } : prev);
                    await sleepWithSignal(800, signal);
                }
            };

            const playTtsChunkAt = async (jobId, idx, totalChunks) => {
                if (ttsActiveJobRef.current !== jobId) return;
                if (idx < 0 || idx >= totalChunks) {
                    setTtsState(prev => prev.jobId === jobId ? {
                        ...prev,
                        isPlaying: false,
                        isLoading: false,
                        status: 'Ferdig opplest',
                    } : prev);
                    return;
                }

                const signal = ttsAbortRef.current?.signal;
                setTtsState(prev => prev.jobId === jobId ? {
                    ...prev,
                    chunkIndex: idx,
                    isLoading: true,
                    isPlaying: false,
                    status: `Venter på del ${idx + 1} av ${totalChunks}...`,
                    error: '',
                } : prev);

                try {
                    const audioUrl = await fetchTtsChunkUrl(jobId, idx, signal);
                    if (ttsActiveJobRef.current !== jobId) return;

                    // Prefetch neste del i bakgrunnen mens denne spiller
                    if (idx + 1 < totalChunks) {
                        fetchTtsChunkUrl(jobId, idx + 1, signal).catch(() => {});
                    }

                    const audio = ttsAudioRef.current || new Audio();
                    ttsAudioRef.current = audio;
                    audio.src = audioUrl;
                    audio.playbackRate = ttsSettingsRef.current.speed || 1.0;
                    audio.preservesPitch = true;
                    audio.webkitPreservesPitch = true;

                    audio.onended = () => {
                        if (ttsActiveJobRef.current === jobId) {
                            playTtsChunkAt(jobId, idx + 1, totalChunks);
                        }
                    };
                    audio.onerror = () => {
                        if (ttsActiveJobRef.current === jobId) {
                            setTtsState(prev => ({ ...prev, isPlaying: false, isLoading: false, error: 'Kunne ikke spille av lydfilen.' }));
                        }
                    };

                    try {
                        await audio.play();
                    } catch (playErr) {
                        if (playErr?.name === 'NotAllowedError') {
                            setTtsState(prev => prev.jobId === jobId ? {
                                ...prev,
                                chunkIndex: idx,
                                isLoading: false,
                                isPlaying: false,
                                status: `Del ${idx + 1} klar – trykk Play for å fortsette`,
                                error: '',
                            } : prev);
                            return;
                        }
                        throw playErr;
                    }
                    if (ttsActiveJobRef.current !== jobId) return;

                    setTtsState(prev => prev.jobId === jobId ? {
                        ...prev,
                        chunkIndex: idx,
                        isLoading: false,
                        isPlaying: true,
                        status: `Spiller del ${idx + 1} av ${totalChunks}`,
                        error: '',
                    } : prev);
                } catch (err) {
                    if (err?.name === 'AbortError' || ttsActiveJobRef.current !== jobId) return;
                    if (err?.message === 'AUTH_REQUIRED') {
                        setTtsSettingsOpen(true);
                        setTtsState(prev => ({ ...prev, isLoading: false, isPlaying: false, error: 'Innlogging kreves – skriv inn passord i TTS-innstillinger.' }));
                        return;
                    }
                    setTtsState(prev => prev.jobId === jobId ? {
                        ...prev,
                        isLoading: false,
                        isPlaying: false,
                        error: `Feil ved avspilling: ${err?.message || 'Ukjent feil'}`,
                    } : prev);
                }
            };

            const playArticleTTS = async (art, overrideVoice) => {
                if (!art) return;

                // Hvis samme artikkel allerede er aktiv og ingen ny stemme ble valgt: bytt Play/Pause
                if (!overrideVoice && ttsState.articleId === art.id && ttsState.jobId && ttsAudioRef.current?.src) {
                    toggleTtsPlayPause();
                    return;
                }

                // Lås opp lyd på iOS/mobil synkront i klikk-hendelsen
                if (!ttsAudioRef.current) {
                    ttsAudioRef.current = new Audio();
                }

                await stopTts(false);

                const cfg = ttsSettingsRef.current;
                const voice = overrideVoice || cfg.voice || 'kvinne';
                const base = (cfg.serverUrl || '').replace(/\/+$/, '');
                if (!base) {
                    setTtsSettingsOpen(true);
                    return;
                }

                const controller = new AbortController();
                ttsAbortRef.current = controller;

                setTtsState({
                    visible: true,
                    articleId: art.id,
                    article: art,
                    title: art.title || 'Artikkel',
                    source: '',
                    jobId: null,
                    cached: false,
                    currentTime: 0,
                    duration: 0,
                    chunkIndex: 0,
                    totalChunks: 0,
                    chunks: [],
                    expanded: false,
                    isLoading: true,
                    isPlaying: false,
                    status: 'Henter artikkel og starter opplesing...',
                    error: '',
                });

                try {
                    const summaryText = cleanRssSummary(art.summary || art.content || '');
                    const res = await fetch(`${base}/api/tts/start`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...getTtsHeaders(cfg),
                        },
                        body: JSON.stringify({
                            url: art.url || '',
                            title: art.title || '',
                            summary: summaryText,
                            voice,
                            pace: 'normal',
                            steps: cfg.steps || 8,
                        }),
                        signal: controller.signal,
                    });

                    if (res.status === 401) {
                        setTtsSettingsOpen(true);
                        setTtsState(prev => ({
                            ...prev,
                            isLoading: false,
                            error: 'Skriv inn brukernavn og passord for TTS-serveren.',
                        }));
                        return;
                    }
                    if (!res.ok) {
                        throw new Error(`Server svarte ${res.status}`);
                    }

                    const data = await res.json();
                    if (controller.signal.aborted) return;

                    const fallbackChunks = [summaryText || art.title || ''].filter(Boolean);
                    const respChunks = Array.isArray(data.chunks) && data.chunks.length > 0 ? data.chunks : fallbackChunks;

                    // Hvis artikkelen allerede er ferdig generert som MP3 på Mac-en: spill umiddelbart!
                    if (data.cached && data.key) {
                        await playCachedMp3ByKey(data.key, data.duration, data.source, respChunks, controller.signal);
                        return;
                    }

                    ttsActiveJobRef.current = data.job_id;
                    setTtsState(prev => ({
                        ...prev,
                        jobId: data.job_id,
                        cached: false,
                        totalChunks: data.total_chunks,
                        chunks: respChunks,
                        source: data.source,
                        status: cfg.waitForFull
                            ? `Venter på hele artikkelen (0/${data.total_chunks} deler)...`
                            : `Genererer del 1 av ${data.total_chunks}...`,
                    }));

                    if (cfg.waitForFull) {
                        await waitForFullJobAndPlay(data.job_id, data.total_chunks, data.source, respChunks, controller.signal);
                    } else {
                        playTtsChunkAt(data.job_id, 0, data.total_chunks);
                    }
                } catch (err) {
                    if (err?.name === 'AbortError') return;
                    setTtsState(prev => ({
                        ...prev,
                        isLoading: false,
                        isPlaying: false,
                        error: `Kunne ikke nå TTS-serveren (${base}): ${err?.message || 'Nettverksfeil'}`,
                    }));
                }
            };

            const toggleTtsPlayPause = () => {
                const audio = ttsAudioRef.current;
                if (!audio || !audio.src) return;
                if (audio.paused) {
                    audio.playbackRate = ttsSettingsRef.current.speed || 1.0;
                    audio.play().then(() => {
                        setTtsState(prev => ({ ...prev, isPlaying: true }));
                    }).catch(() => {});
                } else {
                    audio.pause();
                    setTtsState(prev => ({ ...prev, isPlaying: false }));
                }
            };

            const skipTtsChunk = (delta) => {
                if (!ttsState.jobId || !ttsState.totalChunks) return;
                const nextIdx = Math.max(0, Math.min(ttsState.totalChunks - 1, ttsState.chunkIndex + delta));
                playTtsChunkAt(ttsState.jobId, nextIdx, ttsState.totalChunks);
            };

            useEffect(() => {
                if (!('mediaSession' in navigator)) return;
                if (!ttsState.visible) {
                    try {
                        navigator.mediaSession.playbackState = 'none';
                    } catch {}
                    return;
                }

                try {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: ttsState.title || 'Akkar Opplesing',
                        artist: ttsState.article?.feedTitle || 'Akkar',
                        album: 'Opplest · NB-TTS',
                        artwork: [
                            { src: './icon-192.png', sizes: '192x192', type: 'image/png' },
                            { src: './icon-512.png', sizes: '512x512', type: 'image/png' },
                        ],
                    });
                    navigator.mediaSession.playbackState = ttsState.isPlaying ? 'playing' : 'paused';

                    navigator.mediaSession.setActionHandler('play', () => {
                        if (ttsAudioRef.current?.paused) toggleTtsPlayPause();
                    });
                    navigator.mediaSession.setActionHandler('pause', () => {
                        if (ttsAudioRef.current && !ttsAudioRef.current.paused) toggleTtsPlayPause();
                    });
                    navigator.mediaSession.setActionHandler('stop', () => {
                        stopTts(true);
                    });
                    navigator.mediaSession.setActionHandler('seekbackward', (details) => {
                        const audio = ttsAudioRef.current;
                        if (audio && ttsState.cached) {
                            audio.currentTime = Math.max(0, audio.currentTime - (details?.seekOffset || 15));
                        } else {
                            skipTtsChunk(-1);
                        }
                    });
                    navigator.mediaSession.setActionHandler('seekforward', (details) => {
                        const audio = ttsAudioRef.current;
                        if (audio && ttsState.cached && Number.isFinite(audio.duration)) {
                            audio.currentTime = Math.min(audio.duration, audio.currentTime + (details?.seekOffset || 15));
                        } else {
                            skipTtsChunk(1);
                        }
                    });
                    navigator.mediaSession.setActionHandler('previoustrack', () => {
                        if (!ttsState.cached) skipTtsChunk(-1);
                    });
                    navigator.mediaSession.setActionHandler('nexttrack', () => {
                        if (!ttsState.cached) skipTtsChunk(1);
                    });
                } catch {}
            }, [ttsState.visible, ttsState.title, ttsState.isPlaying, ttsState.cached, ttsState.jobId, ttsState.chunkIndex, ttsState.totalChunks]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    const tag = e.target?.tagName?.toLowerCase();
                    const isTyping = tag === 'input' || tag === 'textarea' || e.target?.isContentEditable;
                    if (isTyping) return;

                    if (e.key === 'j' || e.key === 'J' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        setFocusedArticleIndex(prev => {
                            if (displayedArticles.length === 0) return -1;
                            return Math.min(prev < 0 ? 0 : prev + 1, displayedArticles.length - 1);
                        });
                    } else if (e.key === 'k' || e.key === 'K' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        setFocusedArticleIndex(prev => {
                            if (displayedArticles.length === 0) return -1;
                            return Math.max(prev < 0 ? 0 : prev - 1, 0);
                        });
                    } else if ((e.key === 'Enter' || e.key === 'o' || e.key === 'O') && focusedArticleIndex >= 0) {
                        const article = displayedArticles[focusedArticleIndex];
                        if (article) openArticle(article);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [displayedArticles, focusedArticleIndex]);

            useEffect(() => {
                if (focusedArticleIndex < 0) return;
                const el = document.querySelector(`[data-akkar-article-index="${focusedArticleIndex}"]`);
                el?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }, [focusedArticleIndex]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const PULL_REFRESH_MAX = 84;
            const PULL_TRIGGER_THRESHOLD = 52;

            const applyPullTransforms = (distance, animate = false, refreshing = false) => {
                const clamped = Math.max(0, Math.min(PULL_REFRESH_MAX, distance));
                const progress = Math.min(1, clamped / PULL_TRIGGER_THRESHOLD);
                const pillY = refreshing ? 14 : (-28 + clamped * 0.56);
                const pillScale = refreshing ? 1 : (0.86 + 0.14 * progress);
                const pillOpacity = refreshing ? 1 : Math.min(1, clamped / 24);
                const listY = refreshing ? 0 : Math.round(clamped * 0.52);
                const spring = 'transform 280ms cubic-bezier(0.22, 1, 0.36, 1), opacity 200ms ease';

                if (pullIndicatorRef.current) {
                    pullIndicatorRef.current.style.transition = animate ? spring : 'none';
                    pullIndicatorRef.current.style.transform = `translate3d(0, ${pillY.toFixed(1)}px, 0) scale(${pillScale.toFixed(3)})`;
                    pullIndicatorRef.current.style.opacity = String(pillOpacity.toFixed(2));
                }

                if (pullContentRef.current) {
                    pullContentRef.current.style.transition = animate
                        ? 'transform 280ms cubic-bezier(0.22, 1, 0.36, 1)'
                        : 'none';
                    pullContentRef.current.style.transform = `translate3d(0, ${listY}px, 0)`;
                }

                if (pullIconRef.current && !refreshing) {
                    pullIconRef.current.style.transition = animate ? 'transform 220ms ease-out' : 'none';
                    pullIconRef.current.style.transform = `rotate(${Math.round(progress * 300)}deg)`;
                }
            };

            const resetPullVisual = (animate = true) => {
                pullDistanceRef.current = 0;
                pullReadyRef.current = false;

                if (!isRefreshing) {
                    applyPullTransforms(0, animate, false);
                    if (pullLabelRef.current) {
                        pullLabelRef.current.textContent = 'Dra ned for å oppdatere';
                    }
                }
            };

            const startPullRefresh = async () => {
                if (refreshInFlight.current || isRefreshing) return;

                pullReadyRef.current = false;
                pullActive.current = false;
                pullDistanceRef.current = PULL_TRIGGER_THRESHOLD;
                setIsPullDragging(false);
                applyPullTransforms(PULL_TRIGGER_THRESHOLD, true, true);
                setPullDistance(PULL_TRIGGER_THRESHOLD);

                try {
                    await refreshAllFeeds(false, false);
                } finally {
                    pullDistanceRef.current = 0;
                    setPullDistance(0);
                    applyPullTransforms(0, true, false);
                }
            };

            const handlePullStart = (e) => {
                if (
                    !isRefreshing &&
                    !refreshInFlight.current &&
                    e.currentTarget.scrollTop <= 0 &&
                    e.touches?.length === 1
                ) {
                    pullStartY.current = e.touches[0].clientY;
                    pullStartX.current = e.touches[0].clientX;
                    pullActive.current = true;
                    pullReadyRef.current = false;

                    if (pullIndicatorRef.current) {
                        pullIndicatorRef.current.style.willChange = 'transform, opacity';
                    }
                    if (pullContentRef.current) {
                        pullContentRef.current.style.willChange = 'transform';
                    }
                } else {
                    pullStartY.current = null;
                    pullStartX.current = null;
                    pullActive.current = false;
                }
            };

            const handlePullMove = (e) => {
                if (
                    !pullActive.current ||
                    pullStartY.current === null ||
                    pullStartX.current === null ||
                    e.touches?.length !== 1
                ) return;

                if (e.currentTarget.scrollTop > 0) {
                    pullActive.current = false;
                    resetPullVisual(false);
                    return;
                }

                const dx = e.touches[0].clientX - pullStartX.current;
                const dy = e.touches[0].clientY - pullStartY.current;

                // Horisontal artikkelsveip skal aldri kunne bli tolket som oppdatering.
                if (Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) {
                    pullActive.current = false;
                    pullStartY.current = null;
                    pullStartX.current = null;
                    resetPullVisual(false);
                    return;
                }

                if (dy <= 0) {
                    resetPullVisual(false);
                    return;
                }

                // Myk gummistrikk-motstand (eksponentiell demping) med 60/120fps GPU-transform.
                const dampedDistance = PULL_REFRESH_MAX * (1 - Math.exp(-dy / 135));
                pullDistanceRef.current = dampedDistance;
                applyPullTransforms(dampedDistance, false, false);

                const isReady = dampedDistance >= PULL_TRIGGER_THRESHOLD;
                if (isReady && !pullReadyRef.current) {
                    pullReadyRef.current = true;
                    if (navigator.vibrate) {
                        try { navigator.vibrate(8); } catch {}
                    }
                } else if (!isReady && pullReadyRef.current) {
                    pullReadyRef.current = false;
                }

                if (pullLabelRef.current) {
                    pullLabelRef.current.textContent = isReady
                        ? 'Slipp for å oppdatere'
                        : 'Dra ned for å oppdatere';
                }
            };

            const handlePullEnd = () => {
                pullStartY.current = null;
                pullStartX.current = null;

                if (pullContentRef.current) {
                    pullContentRef.current.style.willChange = 'auto';
                }

                if (refreshInFlight.current || isRefreshing) {
                    pullActive.current = false;
                    setIsPullDragging(false);
                    return;
                }

                const shouldRefresh = pullActive.current && pullReadyRef.current;
                pullActive.current = false;
                setIsPullDragging(false);

                if (shouldRefresh) {
                    startPullRefresh();
                } else {
                    setPullDistance(0);
                    resetPullVisual(true);
                }
            };

            const sidebarRegularFolders = useMemo(
                () => folders.filter(folder => folder.id !== UNGROUPED_FOLDER_ID),
                [folders]
            );

            const sidebarUngroupedFeeds = useMemo(() => {
                const ungrouped = folders.find(folder => folder.id === UNGROUPED_FOLDER_ID);
                return ungrouped?.feeds || [];
            }, [folders]);

            const getSidebarSlotFeeds = (slot) => {
                const maxSlot = sidebarRegularFolders.length;
                return sidebarUngroupedFeeds.filter(feed => {
                    const raw = Number(feed.sidebarSlot);
                    const normalized = Number.isFinite(raw)
                        ? Math.max(0, Math.min(Math.round(raw), maxSlot))
                        : 0;
                    return normalized === slot;
                });
            };

            const activeFeedIsEmpty =
                activeFilter.type === 'feed' &&
                !!activeFilter.id &&
                !articles.some(article => article.feedId === activeFilter.id) &&
                !pendingArticles.some(article => article.feedId === activeFilter.id);

            const emptyStateInfo = (() => {
                if (!activeFilter.id) return {title:'Velg en strøm', detail:'Velg en feed eller mappe i menyen.'};
                const feedIds = activeFilter.type === 'folder'
                    ? new Set((folders.find(f => f.id === activeFilter.id)?.feeds || []).map(f => f.id))
                    : new Set([activeFilter.id]);
                let candidates = articles.filter(a => feedIds.has(a.feedId));
                if (!candidates.length) return {title:'Ingen artikler', detail: activeFilter.type === 'folder' ? 'Denne mappen har ingen artikler ennå.' : 'Denne strømmen har ingen artikler ennå.'};

                if (activeStreamSettings.hideRead) {
                    const next = candidates.filter(a => !a.read);
                    if (!next.length) return {title:'Alle artikler er lest', detail:'Skjul leste artikler er aktivert.'};
                    candidates = next;
                }
                if (activeStreamSettings.requireImage) {
                    const next = candidates.filter(a => {
                        const img = String(a.imageUrl || '').trim();
                        return !!img && img !== APP_LOGO && !img.includes('placehold.co');
                    });
                    if (!next.length) return {title:'Ingen artikler med bilde', detail:'Bildefilteret skjuler alle artiklene.'};
                    candidates = next;
                }
                if (blockedWords.length) {
                    const next = candidates.filter(a => !articleMatchesBlockedWords(a, blockedWords));
                    if (!next.length) return {title:'Alle artiklene er filtrert bort', detail:'Ordfilteret skjuler alle artiklene.'};
                    candidates = next;
                }
                if (searchQuery.trim()) {
                    const q = searchQuery.trim().toLocaleLowerCase('nb-NO');
                    const next = candidates.filter(a => [a.title,a.summary,a.content,a.feedTitle,a.author].join(' ').toLocaleLowerCase('nb-NO').includes(q));
                    if (!next.length) return {title:'Ingen søketreff', detail:'Prøv et annet søkeord.'};
                }
                return {title:'Ingen artikler å vise', detail:'Ingen artikler oppfyller de valgte kriteriene.'};
            })();

            const renderSidebarContents = (mobile = false) => {
                const navigateFromSidebar = mobile
                    ? () => setIsMenuOpen(false)
                    : () => {};

                return (
                    <>
                        <div className="p-5 border-b border-brand-100 dark:border-darkborder">
                            <div className="flex items-center justify-between gap-3">
                                <div className="flex items-center gap-3 min-w-0">
                                    <div className="w-12 h-12 rounded-full bg-darkcard text-accent-300 border-2 border-accent-500/50 flex items-center justify-center shrink-0">
                                        <i data-lucide="user" className="w-6 h-6"></i>
                                    </div>
                                    <div className="min-w-0">
                                        <div className="font-bold text-brand-900 dark:text-white truncate">Min konto</div>
                                        <div className="text-xs text-brand-700/70 dark:text-brand-200/70 truncate">Akkar</div>
                                    </div>
                                </div>

                                {mobile && (
                                    <button

            useEffect(() => {

                const sortable = new window.Sortable(el, {

                        clearUngroupedDropActive();

                        const item = evt.item;
                        const from = evt.from;
                        const feedId = item?.getAttribute('data-akkar-feed-id');

                        const oldIndex = Number.isInteger(evt.oldDraggableIndex)

                            : evt.oldIndex;
                        const newIndex = Number.isInteger(evt.newDraggableIndex)

                        setTimeout(() => {

                                );

                                const restoreIndex = Number.isInteger(oldIndex)
                                    ? Math.max(0, Math.min(oldIndex, siblings.length))
                                    : siblings.length;
                                const anchor = siblings[restoreIndex] || null;

                                if (item.parentNode !== from || item.nextSibling !== anchor) {
                                    from.insertBefore(item, anchor);
                                }

                                    feedId,
                                    fromFolderId,
                                    toFolderId,
                                    newIndex,

        function getVirtualArticleEstimate(cardStyle, cardScale = 100, textScale = 100) {
            const width = Math.min(
                896,
                Math.max(300, (typeof window !== 'undefined' ? window.innerWidth : 390) - 24)
            );
            const cardFactor = Math.max(0.75, cardScale / 100);
            const textFactor = Math.max(0.8, textScale / 100);

            if (cardStyle === 'compact') {
                const base = typeof window !== 'undefined' && window.innerWidth >= 640 ? 144 : 112;
                return Math.round(base * cardFactor + 4);
            }

            if (cardStyle === 'grid') {
                const columnWidth = Math.max(145, (width - 12) / 2);
                const imageHeight = columnWidth * cardFactor / 1.6;
                return Math.round(imageHeight + 145 * textFactor);
            }

            return Math.round(Math.max(240, width * cardFactor / 1.6));
        }

        function VirtualArticleShell({
            article,
            index,
            scrollRootRef,
            cardStyle,
            textScale,
            cardScale,
            className = '',
            children
        }) {
            const shellRef = useRef(null);
            const [isNearViewport, setIsNearViewport] = useState(index < 14);
            const [measuredHeight, setMeasuredHeight] = useState(null);

            const estimatedHeight = getVirtualArticleEstimate(
                cardStyle,
                cardScale,
                textScale
            );

            useEffect(() => {
                const node = shellRef.current;
                const root = scrollRootRef?.current;

                if (!node || !root || !('IntersectionObserver' in window)) {
                    setIsNearViewport(true);
                    return;
                }

                const observer = new IntersectionObserver(
                    entries => {
                        const entry = entries[0];
                        if (entry) setIsNearViewport(entry.isIntersecting);
                    },
                    {
                        root,
                        // Litt innhold over og under skjermen rendres på forhånd,
                        // slik at rask scrolling fortsatt oppleves sømløs.
                        rootMargin: '1100px 0px'
                    }
                );

                observer.observe(node);
                return () => observer.disconnect();
            }, [article.id, cardStyle, scrollRootRef]);

            useEffect(() => {
                if (!isNearViewport) return;

                const node = shellRef.current;
                if (!node) return;

                const measure = () => {
                    const height = node.getBoundingClientRect().height;
                    if (height > 8) {
                        setMeasuredHeight(previous =>
                            previous && Math.abs(previous - height) < 1
                                ? previous
                                : height
                        );
                    }
                };

                const frameId = requestAnimationFrame(measure);

                let resizeObserver = null;
                if ('ResizeObserver' in window) {
                    resizeObserver = new ResizeObserver(measure);
                    resizeObserver.observe(node);
                }

                return () => {
                    cancelAnimationFrame(frameId);
                    resizeObserver?.disconnect();
                };
            }, [isNearViewport, article.id, cardStyle, textScale, cardScale]);

            const reservedHeight = measuredHeight || estimatedHeight;

            return (
                <div
                    ref={shellRef}
                    data-akkar-article-index={index}
                    data-akkar-article-id={article.id}
                    className={className}
                    style={
                        isNearViewport
                            ? undefined
                            : {
                                height: `${reservedHeight}px`,
                                contain: 'layout style paint'
                            }
                    }
                >
                    {isNearViewport ? children : null}
                </div>
            );
        }

        function SavedSwipeArticleItem({ article, onOpen, onToggleRead, onToggleStar, onSpeak, isTtsActive = false, isTtsPlaying = false, isTtsLoading = false, isTtsCached = false }) {

        function CardArticleItem({
            article,
            onOpen,
            onToggleStar,
            onToggleRead,
            onSpeak,
            isTtsActive = false,
            isTtsPlaying = false,
            isTtsLoading = false,
            isTtsCached = false,
            textScale = 100,
            cardScale = 100,
            savedPanelMode = false
        }) {
            const shareArticle = async () => {
                let text = cleanRssSummary(article.summary || article.content || '');

                text = text
                    .replace(/\s+(?:Foto|Photo|Bilde|Bildetekst|Image|Illustrasjon|Kreditering|Credit)\s*:.*$/i, '')
                    .replace(/\s+[–—|•]\s*(?:Foto|Photo|Bilde|Bildetekst|Image|Illustrasjon|Kreditering|Credit)\b.*$/i, '')
                    .replace(/\s+\((?:Foto|Photo|Bilde|Image|Illustrasjon)\s*:.*\)\s*$/i, '')
                    .trim();

                const shareText = [
                    article.title,
                    text,
                    article.url
                ].filter(Boolean).join('\n\n');

                try {
                    if (navigator.share) {
                        await navigator.share({ text: shareText });
                    } else if (navigator.clipboard?.writeText) {
                        await navigator.clipboard.writeText(shareText);
                    }
                } catch (e) {
                    if (e?.name !== 'AbortError') {
                        console.warn('Kunne ikke dele artikkelen:', e);

                                                            : 'bg-brand-200/75 dark:bg-black/45 border-brand-300/70 dark:border-white/10 text-brand-700/75 dark:text-brand-400/75 hover:border-brand-400 dark:hover:bg-black/60'
                                                }`}
                                                title={isTtsPlaying ? 'Pause opplesing' : isTtsCached ? 'Klar til avspilling (ferdig generert)' : 'Ikke ferdig prosessert ennå'}
                                                aria-label={isTtsPlaying ? 'Pause opplesing' : 'Les opp artikkel'}
                                            >
                                                <ArticleActionIcon name={isTtsPlaying ? 'pause' : 'play'} className={`w-4 h-4 ${isTtsLoading ? 'animate-pulse' : ''}`} />

                                        <button
                                            type="button"

                                                article.starred
                                                    ? 'bg-brand-600 border-brand-600 text-white'

                                            }`}
                                            title={article.starred ? 'Fjern fra Les senere' : 'Les senere'}
                                            aria-label={article.starred ? 'Fjern fra Les senere' : 'Les senere'}

        function SwipeableArticleFrame({
            article,
            onOpen,
            onToggleRead,
            onToggleStar,
            onSpeak,
            shareArticle,
            roundedClass = 'rounded-xl',
            children
        }) {
            const [swipeX, setSwipeX] = useState(0);
            const swipeXRef = useRef(0);
            const swipeCardRef = useRef(null);
            const swipeLeftActionRef = useRef(null);
            const swipeRightActionRef = useRef(null);
            const readActionRef = useRef(null);
            const speakActionButtonRef = useRef(null);
            const shareActionButtonRef = useRef(null);
            const saveActionButtonRef = useRef(null);
            const activeSwipeActionRef = useRef(null);
            const swipeFrameRef = useRef(null);
            const pendingSwipeXRef = useRef(0);
            const touchStart = useRef(null);
            const gearAnchorYRef = useRef(null);
            const gearVerticalRef = useRef(0);
            const swiping = useRef(false);
            const swipeDirectionLocked = useRef(false);
            const suppressClick = useRef(false);

            const ACTION_RED = '#A82151';
            const ACTION_YELLOW = '#A9843C';
            const READ_TRIGGER = 56;
            const GEAR_ENGAGE_X = -52;
            const GEAR_SHIFT_Y = 26;

            useEffect(() => {
                return () => {
                    if (swipeFrameRef.current) {
                        cancelAnimationFrame(swipeFrameRef.current);
                    }
                };
            }, []);

            const setSwipeActionActive = (action) => {
                if (activeSwipeActionRef.current === action) return;
                activeSwipeActionRef.current = action;

                if (action && navigator.vibrate) {
                    try { navigator.vibrate(8); } catch {}
                }

                const applyActionState = (element, active) => {
                    if (!element) return;
                    element.style.outline = 'none';
                    element.style.boxShadow = 'none';
                    element.style.filter = 'none';
                    element.style.backgroundColor = active ? ACTION_YELLOW : ACTION_RED;
                    element.style.transform = active ? 'scale(1.03)' : 'none';
                    element.style.transformOrigin = 'center';
                };

                applyActionState(readActionRef.current, action === 'read');
                applyActionState(speakActionButtonRef.current, action === 'speak');
                applyActionState(shareActionButtonRef.current, action === 'share');
                applyActionState(saveActionButtonRef.current, action === 'save');
            };

            const renderSwipePosition = (clamped, animate = false) => {
                if (swipeCardRef.current) {
                    swipeCardRef.current.style.transition = animate
                        ? 'transform 145ms cubic-bezier(0.22, 1, 0.36, 1)'
                        : 'none';
                    swipeCardRef.current.style.transform = `translate3d(${clamped}px, 0, 0)`;
                }

                if (swipeLeftActionRef.current) {
                    swipeLeftActionRef.current.style.opacity = clamped > 0 ? '1' : '0';
                }

                if (swipeRightActionRef.current) {
                    swipeRightActionRef.current.style.opacity = clamped < 0 ? '1' : '0';
                }

                if (clamped >= READ_TRIGGER) {
                    setSwipeActionActive('read');
                } else if (clamped <= GEAR_ENGAGE_X) {
                    const dyGear = gearVerticalRef.current;
                    if (dyGear <= -GEAR_SHIFT_Y && onSpeak) {
                        setSwipeActionActive('speak');
                    } else if (dyGear >= GEAR_SHIFT_Y) {
                        setSwipeActionActive('save');
                    } else {
                        setSwipeActionActive('share');
                    }
                } else {
                    setSwipeActionActive(null);
                }
            };

            const applySwipePosition = (x, animate = false) => {
                const clamped = Math.max(-136, Math.min(110, x));
                swipeXRef.current = clamped;
                pendingSwipeXRef.current = clamped;

                if (animate) {
                    if (swipeFrameRef.current) {
                        cancelAnimationFrame(swipeFrameRef.current);
                        swipeFrameRef.current = null;
                    }
                    renderSwipePosition(clamped, true);
                    return;
                }

                if (swipeFrameRef.current) return;

                swipeFrameRef.current = requestAnimationFrame(() => {
                    swipeFrameRef.current = null;
                    renderSwipePosition(pendingSwipeXRef.current, false);
                });
            };

            const settleSwipePosition = (x) => {
                if (swipeFrameRef.current) {
                    cancelAnimationFrame(swipeFrameRef.current);
                    swipeFrameRef.current = null;
                }

                gearAnchorYRef.current = null;
                gearVerticalRef.current = 0;
                pendingSwipeXRef.current = x;
                applySwipePosition(x, true);
                setSwipeX(x);
            };

            const handleTouchStart = (e) => {
                if (e.touches?.length !== 1) return;

                touchStart.current = {
                    x: e.touches[0].clientX,
                    y: e.touches[0].clientY,
                    baseX: swipeXRef.current
                };

                gearAnchorYRef.current = null;
                gearVerticalRef.current = 0;
                swiping.current = false;
                swipeDirectionLocked.current = false;
                suppressClick.current = false;

                if (swipeCardRef.current) {
                    swipeCardRef.current.style.transition = 'none';
                }
            };

            const handleTouchMoveRef = useRef(null);
            handleTouchMoveRef.current = (e) => {
                if (!touchStart.current || e.touches?.length !== 1) return;

                const touchX = e.touches[0].clientX;
                const touchY = e.touches[0].clientY;
                const dx = touchX - touchStart.current.x;
                const dy = touchY - touchStart.current.y;

                if (!swipeDirectionLocked.current) {
                    if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;

                    if (Math.abs(dy) > Math.abs(dx)) {
                        touchStart.current = null;
                        return;
                    }

                    swipeDirectionLocked.current = true;
                    swiping.current = true;
                    suppressClick.current = true;
                }

                // Når horisontal gir-sveip er aktiv, hindrer vi sideskrolling slik at
                // fingerbevegelse opp/ned skifter gir (Lyd / Dele / Les senere) mykt.
                if (e.cancelable) {
                    e.preventDefault();
                }

                const nextX = touchStart.current.baseX + dx;
                if (nextX <= GEAR_ENGAGE_X) {
                    if (gearAnchorYRef.current === null) {
                        gearAnchorYRef.current = touchY;
                    }
                    gearVerticalRef.current = touchY - gearAnchorYRef.current;
                } else {
                    gearAnchorYRef.current = null;
                    gearVerticalRef.current = 0;
                }

                applySwipePosition(nextX, false);
            };

            useEffect(() => {
                const el = swipeCardRef.current;
                if (!el) return;
                const onMove = (e) => handleTouchMoveRef.current?.(e);
                el.addEventListener('touchmove', onMove, { passive: false });
                return () => el.removeEventListener('touchmove', onMove);
            }, []);

            const handleTouchEnd = () => {
                if (!swiping.current) {
                    touchStart.current = null;
                    return;
                }

                if (activeSwipeActionRef.current === 'read') {
                    onToggleRead?.();
                } else if (activeSwipeActionRef.current === 'speak') {
                    onSpeak?.();
                } else if (activeSwipeActionRef.current === 'save') {
                    onToggleStar?.();
                } else if (activeSwipeActionRef.current === 'share') {
                    shareArticle?.();
                }

                settleSwipePosition(0);
                setSwipeActionActive(null);
                touchStart.current = null;

                setTimeout(() => {
                    swiping.current = false;
                    swipeDirectionLocked.current = false;
                    suppressClick.current = false;
                }, 90);
            };

            const handleTouchCancel = () => {
                settleSwipePosition(0);
                setSwipeActionActive(null);
                touchStart.current = null;
                swiping.current = false;
                swipeDirectionLocked.current = false;
                suppressClick.current = false;
            };

            const handleClick = () => {
                if (suppressClick.current) return;

                if (swipeXRef.current !== 0) {
                    settleSwipePosition(0);
                    return;
                }

                onOpen?.();
            };

            return (
                <div className={`relative w-full overflow-hidden ${roundedClass}`}>
                    <div
                        ref={swipeLeftActionRef}
                        className="absolute inset-y-0 left-0 w-28 text-white"
                        style={{ opacity: swipeX > 0 ? 1 : 0 }}
                    >
                        <div
                            ref={readActionRef}
                            className="absolute inset-0 flex items-center justify-center gap-1.5 text-xs font-semibold text-white transition-colors duration-120"
                            style={{ backgroundColor: ACTION_RED }}
                        >
                            <ArticleActionIcon name={article.read ? 'mail' : 'check'} className="w-5 h-5" />
                            {article.read ? 'Ulest' : 'Lest'}
                        </div>
                    </div>

                    <div
                        ref={swipeRightActionRef}
                        className="absolute inset-y-0 right-0 w-32 flex flex-col items-stretch divide-y divide-white/15"
                        style={{ opacity: swipeX < 0 ? 1 : 0 }}
                    >
                        {onSpeak && (
                            <button
                                ref={speakActionButtonRef}
                                type="button"
                                onClick={(e) => {
                                    e.stopPropagation();
                                    onSpeak?.(e);
                                    settleSwipePosition(0);
                                    setSwipeActionActive(null);
                                }}
                                className="flex-1 text-white flex items-center justify-center gap-1.5 text-[11px] font-semibold transition-all duration-100 outline-none focus:outline-none px-2"
                                style={{ backgroundColor: ACTION_RED, WebkitTapHighlightColor: 'transparent' }}
                                aria-label="Spill av lyd"
                            >
                                <span className="text-[10px] opacity-75">↑</span>
                                <ArticleActionIcon name="play" className="w-3.5 h-3.5 shrink-0" />
                                <span className="truncate">Lyd</span>
                            </button>
                        )}

                        <button
                            ref={shareActionButtonRef}
                            type="button"
                            onClick={(e) => {
                                e.stopPropagation();
                                shareArticle?.();
                                settleSwipePosition(0);
                                setSwipeActionActive(null);
                            }}
                            className="flex-1 text-white flex items-center justify-center gap-1.5 text-[11px] font-semibold transition-all duration-100 outline-none focus:outline-none px-2"
                            style={{ backgroundColor: ACTION_RED, WebkitTapHighlightColor: 'transparent' }}
                            aria-label="Del artikkel"
                        >
                            <span className="text-[10px] opacity-75">←</span>
                            <ArticleActionIcon name="share-2" className="w-3.5 h-3.5 shrink-0" />
                            <span className="truncate">Dele</span>
                        </button>

                        <button
                            ref={saveActionButtonRef}
                            type="button"
                            onClick={(e) => {
                                e.stopPropagation();
                                onToggleStar?.(e);
                                settleSwipePosition(0);
                                setSwipeActionActive(null);
                            }}
                            className="flex-1 text-white flex items-center justify-center gap-1.5 text-[11px] font-semibold transition-all duration-100 outline-none focus:outline-none px-2"
                            style={{ backgroundColor: ACTION_RED, WebkitTapHighlightColor: 'transparent' }}
                            aria-label={article.starred ? 'Fjern fra Les senere' : 'Lagre i Les senere'}
                        >
                            <span className="text-[10px] opacity-75">↓</span>
                            <ArticleActionIcon name={article.starred ? 'bookmark-check' : 'bookmark-plus'} className="w-3.5 h-3.5 shrink-0" />
                            <span className="truncate">
                                {article.starred ? 'Lagret' : 'Les senere'}
                            </span>
                        </button>
                    </div>

                    <div
                        ref={swipeCardRef}
                        onClick={handleClick}
                        onTouchStart={handleTouchStart}
                        onTouchEnd={handleTouchEnd}
                        onTouchCancel={handleTouchCancel}
                        className="relative z-10 w-full touch-pan-y"
                        style={{
                            transform: `translate3d(${swipeX}px, 0, 0)`,
                            willChange: 'transform',
                            backfaceVisibility: 'hidden',
                            WebkitBackfaceVisibility: 'hidden',
                            contain: 'paint'
                        }}
                    >
                        {children}
                    </div>
                </div>
            );
        }

        function LargeArticleItem({ article, onOpen, onToggleRead, onToggleStar, onSpeak, isTtsActive = false, isTtsPlaying = false, isTtsLoading = false, isTtsCached = false, textScale = 100, cardScale = 100, gridMode = false }) {
            const shareArticle = async () => {
                let ingress = cleanRssSummary(article.summary || article.content || '');
                ingress = ingress
                    .replace(/\s+(?:Foto|Photo|Bilde|Bildetekst|Image|Illustrasjon|Kreditering|Credit)\s*:.*$/i, '')
                    .replace(/\s+[–—|•]\s*(?:Foto|Photo|Bilde|Bildetekst|Image|Illustrasjon|Kreditering|Credit)\b.*$/i, '')
                    .replace(/\s+\((?:Foto|Photo|Bilde|Image|Illustrasjon)\s*:.*\)\s*$/i, '')
                    .trim();

                const shareText = [
                    article.title,
                    ingress,
                    article.url
                ].filter(Boolean).join('\n\n');

                try {
                    if (navigator.share) {
                        await navigator.share({ text: shareText });
                    } else if (navigator.clipboard?.writeText) {
                        await navigator.clipboard.writeText(shareText);
                    }
                } catch (e) {
                    if (e?.name !== 'AbortError') {
                        console.warn('Kunne ikke dele artikkelen:', e);
                    }
                }
            };

            if (gridMode) {
                const ingress = cleanRssSummary(article.summary || article.content || '');

                return (
                    <SwipeableArticleFrame
                        article={article}
                        onOpen={onOpen}
                        onToggleRead={onToggleRead}
                        onToggleStar={onToggleStar}
                        onSpeak={onSpeak}
                        shareArticle={shareArticle}
                        roundedClass="rounded-2xl"
                    >
                    <article
                        style={{
                            '--akkar-text-scale': textScale / 100,
                            '--akkar-card-scale': cardScale / 100
                        }}

                    >
                        <div
                            className="relative w-full overflow-hidden bg-darksidebar"
                            style={{
                                aspectRatio: 1.6 / (cardScale / 100)
                            }}
                        >
                            <img
                                src={(article.imageUrl && !article.imageUrl.includes('placehold.co')) ? article.imageUrl : APP_LOGO}
                                alt={article.title}
                                loading="lazy"
                                decoding="async"
                                className={`absolute inset-0 w-full h-full object-cover ${article.read ? 'grayscale opacity-65' : ''}`}
                                onError={(e) => {
                                    e.currentTarget.onerror = null;
                                    e.currentTarget.src = APP_LOGO;
                                }}
                            />
                        </div>

                        <div className="p-3">
                            <div
                                className={`akkar-large-meta mb-1 ${
                                    article.read
                                        ? 'text-gray-500 dark:text-gray-400'
                                        : 'text-brand-600 dark:text-brand-200'
                                }`}
                            >
                                {formatTimeAgo(article.pubDate)}
                            </div>

                            <h2
                                className={`akkar-large-title font-bold leading-tight line-clamp-3 mb-2 ${
                                    article.read
                                        ? 'text-gray-500 dark:text-gray-300'
                                        : 'text-brand-900 dark:text-white'
                                }`}
                            >
                                {article.title}
                            </h2>

                            <p
                                className={`leading-[1.35] line-clamp-4 ${
                                    article.read
                                        ? 'text-gray-500 dark:text-slate-400'
                                        : 'text-brand-800 dark:text-slate-200'
                                }`}
                                style={{
                                    fontSize: `calc(14px * ${textScale / 100})`
                                }}
                            >
                                {ingress || article.title}
                            </p>

                            <div className="flex justify-end items-center gap-1.5 mt-3">
                                {onSpeak && (
                                    <button
                                        type="button"
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            onSpeak(e);
                                        }}
                                        className={`w-8 h-8 rounded-lg border flex items-center justify-center transition-colors ${
                                            isTtsActive
                                                ? 'bg-brand-600 border-brand-500 text-white'
                                                : isTtsCached
                                                    ? 'bg-white dark:bg-slate-500/40 border-brand-300 dark:border-slate-300/50 text-brand-700 dark:text-white hover:border-brand-400 dark:hover:bg-slate-500/55'
                                                    : 'bg-brand-200/75 dark:bg-black/45 border-brand-300/70 dark:border-white/10 text-brand-700/75 dark:text-brand-400/75 hover:border-brand-400 dark:hover:bg-black/60'
                                        }`}
                                        title={isTtsPlaying ? 'Pause opplesing' : isTtsCached ? 'Klar til avspilling (ferdig generert)' : 'Ikke ferdig prosessert ennå'}
                                        aria-label={isTtsPlaying ? 'Pause opplesing' : 'Les opp artikkel'}
                                    >
                                        <ArticleActionIcon name={isTtsPlaying ? 'pause' : 'play'} className={`w-4 h-4 ${isTtsLoading ? 'animate-pulse' : ''}`} />
                                    </button>
                                )}

                                <button
                                    type="button"
                                    onClick={(e) => {
                                        e.stopPropagation();

                    <div className="flex absolute right-3 bottom-3 z-20 items-center gap-1.5">
                        {onSpeak && (

                        <button

                            aria-label={article.read ? 'Marker som ikke lest' : 'Marker som lest'}
                        >

                        <button

                                shareArticle();

                            className="hidden lg:flex w-9 h-9 rounded-lg bg-black/55 backdrop-blur-sm border border-white/20 text-white items-center justify-center hover:bg-black/75"
                            title="Del"
                            aria-label="Del"
                        >
                            <ArticleActionIcon name="share-2" className="w-4 h-4" />
                        </button>

                        <button
                            type="button"
                            onClick={(e) => {
                                e.stopPropagation();
                                onToggleStar?.(e);
                            }}
                            className={`hidden lg:flex w-9 h-9 rounded-lg backdrop-blur-sm border items-center justify-center ${
                                article.starred
                                    ? 'bg-brand-600 border-brand-500 text-white'
                                    : 'bg-black/55 border-white/20 text-white hover:bg-black/75'
                            }`}
                            title={article.starred ? 'Fjern fra Les senere' : 'Les senere'}
                            aria-label={article.starred ? 'Fjern fra Les senere' : 'Les senere'}
