                                pubDate: it.pubDate || new Date().toISOString(),
                                read: false,
                                starred: false,
                            }));

                        setArticles(prev => mergeAndPruneArticles(prev, incoming));
                        localStorage.setItem('akkar_minerva_100_imported_v1', '1');
                    } catch (e) {
                        console.warn('Kunne ikke importere siste 100 fra Minerva:', e);
                    }
                };

                importMinerva100();
                return () => { cancelled = true; };
            }, []);

            useEffect(() => {
                return () => {
                    if (undoTimerRef.current) {
                        clearTimeout(undoTimerRef.current);
                    }
                    if (savedTopIconTimerRef.current) {
                        clearTimeout(savedTopIconTimerRef.current);
                    }
                    if (savedActionPressTimerRef.current) {
                        clearTimeout(savedActionPressTimerRef.current);
                    }
                    if (scrollSaveTimerRef.current) {
                        clearTimeout(scrollSaveTimerRef.current);
                    }
                };
            }, []);

            useEffect(() => {
                if (!contextMenu) return;

                const closeMenu = () => setContextMenu(null);
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') closeMenu();
                };

                window.addEventListener('click', closeMenu);
                window.addEventListener('resize', closeMenu);
                window.addEventListener('keydown', handleKeyDown);

                return () => {
                    window.removeEventListener('click', closeMenu);
                    window.removeEventListener('resize', closeMenu);
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, [contextMenu]);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const mergeAndPruneArticles = (existingArticles, incomingArticles) => {
                const existingMap = new Map();
                existingArticles.forEach(article => {
                    if (article?.url) existingMap.set(article.url, article);
                });

                const combinedMap = new Map();

                incomingArticles.forEach(article => {
                    if (!article?.url) return;

                    const existing = existingMap.get(article.url);
                    const wasReadInRegistry =
                        Boolean(readUrlsRef.current?.[article.url]) &&
                        !sessionUnreadOverridesRef.current.has(article.url);

                    combinedMap.set(
                        article.url,
                        existing
                            ? {
                                ...article,
                                read: Boolean(existing.read || (!sessionUnreadOverridesRef.current.has(article.url) && wasReadInRegistry)),
                                starred: existing.starred
                            }
                            : {
                                ...article,
                                read: Boolean(article.read || wasReadInRegistry)
                            }
                    );
                });

                existingArticles.forEach(article => {
                    if (article?.url && !combinedMap.has(article.url)) {
                        combinedMap.set(article.url, article);
                    }
                });

                const now = Date.now();
                const READ_RETENTION_MS = 90 * 24 * 60 * 60 * 1000;
                const MAX_RECENT_READ_PER_FEED = 100;

                const feedGroups = {};

                [...combinedMap.values()].forEach(article => {
                    if (!feedGroups[article.feedId]) {
                        feedGroups[article.feedId] = [];
                    }
                    feedGroups[article.feedId].push(article);
                });

                return Object.values(feedGroups)
                    .flatMap(group => {
                        const sorted = [...group].sort((a, b) =>
                            (new Date(b.pubDate).getTime() || 0) -
                            (new Date(a.pubDate).getTime() || 0)
                        );

                        // Uleste og lagrede artikler beholdes alltid, uansett alder.
                        const protectedArticles = sorted.filter(article =>
                            article.starred || !article.read
                        );

                        // Vanlige leste artikler ryddes etter 90 dager og begrenses
                        // samtidig til maks 100 nyere leste artikler per feed.
                        const recentRead = sorted
                            .filter(article => {
                                if (article.starred || !article.read) return false;

                                const published = new Date(article.pubDate).getTime() || 0;
                                if (!published) return true;

                                return now - published <= READ_RETENTION_MS;
                            })
                            .slice(0, MAX_RECENT_READ_PER_FEED);

                        const unique = new Map();

                        [...protectedArticles, ...recentRead].forEach(article => {
                            if (article?.url) unique.set(article.url, article);
                        });

                        return [...unique.values()];
                    })
                    .sort((a, b) =>
                        (new Date(b.pubDate).getTime() || 0) -
                        (new Date(a.pubDate).getTime() || 0)
                    );
            };

            const getPendingForActiveStream = (pending = pendingArticlesRef.current) => {
                if (!activeFilter.id) return [];

                if (activeFilter.type === 'folder') {
                    const folder = foldersRef.current.find(f => f.id === activeFilter.id);
                    const feedIds = new Set((folder?.feeds || []).map(feed => feed.id));
                    return pending.filter(article => feedIds.has(article.feedId));
                }

                return pending.filter(article => article.feedId === activeFilter.id);
            };

            const activePendingArticles = getPendingForActiveStream(pendingArticles);

            const loadPendingArticles = () => {
                const toLoad = getPendingForActiveStream();
                if (!toLoad.length) return;

                const loadUrls = new Set(toLoad.map(article => article.url));
                const remaining = pendingArticlesRef.current.filter(
                    article => !loadUrls.has(article.url)
                );

                setArticles(prev => mergeAndPruneArticles(prev, toLoad));
                pendingArticlesRef.current = remaining;
                setPendingArticles(remaining);
            };

            // Når brukeren bytter feed/mappe, flettes eventuelle ventende artikler
            // inn automatisk – gul melding skal kun vises for nye artikler som
            // ankommer mens man allerede er inne i strømmen.
            useEffect(() => {
                setRecentlyReadIds(prev => (prev.size ? new Set() : prev));
                if (!pendingArticlesRef.current.length) return;
                const toMerge = [...pendingArticlesRef.current];
                pendingArticlesRef.current = [];
                setPendingArticles([]);
                setArticles(prev => mergeAndPruneArticles(prev, toMerge));
            }, [activeFilter.type, activeFilter.id]);

            const refreshAllFeeds = async (silent = false, initial = false) => {
                if (refreshInFlight.current) return;
                refreshInFlight.current = true;

                // Ved første oppstart skal oppdateringen skje helt i bakgrunnen:
                // ingen spinner, ingen toast og ingen "nye artikler"-melding.
                if (!silent && !initial) {
                    setIsRefreshing(true);
                    setRecentlyReadIds(prev => (prev.size ? new Set() : prev));
                    // Hvis det allerede ligger klare ventende artikler, vis dem øyeblikkelig.
                    if (pendingArticlesRef.current.length > 0) {
                        const readyPending = [...pendingArticlesRef.current];
                        pendingArticlesRef.current = [];
                        setPendingArticles([]);
                        setArticles(prev => mergeAndPruneArticles(prev, readyPending));
                    }
                }
                
                const allFeeds = [];
                foldersRef.current.forEach(folder => {
                    if (folder.feeds) {
                        folder.feeds.forEach(feed => {
                            allFeeds.push(feed);
                        });
                    }
                });

                if (allFeeds.length === 0) {
                    if (!silent && !initial) setIsRefreshing(false);
                    refreshInFlight.current = false;
                    if (!silent && !initial) showToast('Ingen strømmer');
                    return;
                }

                const results = await Promise.allSettled(
                    allFeeds.map(feed =>
                        fetchFeedArticles(
                            feed.url,
                            feed.id,
                            feed.title,
                            feed,
                            status => updateFeedHealth(feed.id, status.ok)
                        )
                    )
                );

                let fetchedAll = [];
                results.forEach(result => {
                    if (
                        result.status === 'fulfilled' &&
                        Array.isArray(result.value) &&
                        result.value.length > 0
                    ) {
                        fetchedAll.push(...result.value);
                    }
                });

                let addedCount = 0;

                if (silent && !initial) {
                    // Bakgrunnsoppdatering:
                    // - Nye artikler i andre strømmer flettes rett inn automatisk.
                    // - Nye artikler i strømmen brukeren står i akkurat nå legges i
                    //   pendingArticles slik at kun den aktive strømmen får gul melding.
                    const knownUrls = new Set([
                        ...articlesRef.current.map(article => article.url),
                        ...pendingArticlesRef.current.map(article => article.url)
                    ]);

                    const newArticles = fetchedAll.filter(article =>
                        article.url && !knownUrls.has(article.url)
                    );

                    if (newArticles.length > 0) {
                        const cur = activeFilterRef.current;
                        let activeFeedIds = null;
                        if (cur?.id) {
                            if (cur.type === 'folder') {
                                const fld = foldersRef.current.find(f => f.id === cur.id);
                                activeFeedIds = new Set((fld?.feeds || []).map(f => f.id));
                            } else if (cur.type === 'feed') {
                                activeFeedIds = new Set([cur.id]);
                            }
                        }

                        const forActiveStream = [];
                        const forOtherStreams = [];
                        newArticles.forEach(article => {
                            if (activeFeedIds && activeFeedIds.has(article.feedId)) {
                                forActiveStream.push(article);
                            } else {
                                forOtherStreams.push(article);
                            }
                        });

                        if (forOtherStreams.length > 0) {
                            setArticles(prev => mergeAndPruneArticles(prev, forOtherStreams));
                        }

                        if (forActiveStream.length > 0) {
                            const nextPending = [
                                ...pendingArticlesRef.current,
                                ...forActiveStream
                            ];

                            const uniquePending = [];
                            const seen = new Set();

                            nextPending.forEach(article => {
                                if (!article.url || seen.has(article.url)) return;
                                seen.add(article.url);
                                uniquePending.push(article);
                            });

                            uniquePending.sort((a, b) =>
                                (new Date(b.pubDate).getTime() || 0) -
                                (new Date(a.pubDate).getTime() || 0)
                            );

                            pendingArticlesRef.current = uniquePending;
                            setPendingArticles(uniquePending);
                        }
                    }
                } else {
                    const pendingSnapshot = [...pendingArticlesRef.current];
                    const incoming = [...fetchedAll, ...pendingSnapshot];

                    const currentUrls = new Set(articlesRef.current.map(article => article.url));
                    addedCount = incoming.filter(article =>
                        article.url && !currentUrls.has(article.url)
                    ).length;

                    // Én atomisk oppdatering unngår race mellom hentede og ventende artikler.
                    setArticles(prev => mergeAndPruneArticles(prev, incoming));

                    pendingArticlesRef.current = [];
                    setPendingArticles([]);
                }

                if (!silent && !initial) setIsRefreshing(false);
                refreshInFlight.current = false;

                if (!silent && !initial && fetchedAll.length === 0) {
                    showToast('Kunne ikke oppdatere');
                }
            };

            const refreshActiveFeed = async () => {
                if (refreshInFlight.current) return;
                if (activeFilter.type !== 'feed' || !activeFilter.id) return;

                const activeFeed = foldersRef.current
                    .flatMap(folder => folder.feeds || [])
                    .find(feed => feed.id === activeFilter.id);

                if (!activeFeed) {
                    showToast('Fant ikke strømmen');
                    return;
                }

                refreshInFlight.current = true;
                setIsRefreshing(true);
                setRecentlyReadIds(prev => (prev.size ? new Set() : prev));

                try {
                    const fetched = await fetchFeedArticles(
                        activeFeed.url,
                        activeFeed.id,
                        activeFeed.title,
                        activeFeed,
                        status => updateFeedHealth(activeFeed.id, status.ok)
                    );

                    if (fetched.length > 0) {
                        setArticles(prev => mergeAndPruneArticles(prev, fetched));

                        // Fjern eventuelle ventende kopier for samme strøm nå som
                        // artiklene lastes direkte inn i hovedlisten.
                        const fetchedUrls = new Set(fetched.map(article => article.url).filter(Boolean));
                        setPendingArticles(prev => {
                            const next = prev.filter(article =>
                                article.feedId !== activeFeed.id &&
                                !fetchedUrls.has(article.url)
                            );
                            pendingArticlesRef.current = next;
                            return next;
                        });

                    } else {
                        showToast('Ingen artikler funnet');
                    }
                } catch {
                    showToast('Kunne ikke oppdatere strømmen');
                } finally {
                    setIsRefreshing(false);
                    refreshInFlight.current = false;
                }
            };

            const filteredArticles = useMemo(() => {
                if (!activeFilter.id) return [];

                let allowedFeedIds = null;

                if (activeFilter.type === 'folder') {
                    const folder = folders.find(f => f.id === activeFilter.id);
                    allowedFeedIds = new Set((folder?.feeds || []).map(feed => feed.id));
                }

                return articles.filter(art => {
                    if (activeFilter.type === 'folder') {
                        if (!allowedFeedIds?.has(art.feedId)) return false;
                    } else {
                        if (art.feedId !== activeFilter.id) return false;
                    }

                    if (activeStreamSettings.hideRead && art.read && !recentlyReadIds.has(art.id)) return false;

                    if (activeStreamSettings.requireImage) {
                        const imageUrl = String(art.imageUrl || '').trim();
                        const hasRealImage =
                            !!imageUrl &&
                            imageUrl !== APP_LOGO &&
                            !imageUrl.includes('placehold.co');

                        if (!hasRealImage) return false;
                    }

                    if (blockedWords.length > 0) {
                        const searchableText = [
                            art.title || '',
                            art.summary || '',
                            art.content || ''
                        ].join(' ').toLocaleLowerCase('nb-NO');

                        const matchesBlockedWord = blockedWords.some(word => {
                            const cleanWord = String(word || '').trim();
                            if (!cleanWord) return false;

                            const escaped = cleanWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                            const exactWordPattern = new RegExp(
                                `(^|[^\\p{L}\\p{N}_])${escaped}(?=$|[^\\p{L}\\p{N}_])`,
                                'iu'
                            );

                            return exactWordPattern.test(searchableText);
                        });

                        if (matchesBlockedWord) return false;
                    }

                    const query = searchQuery.trim().toLocaleLowerCase('nb-NO');
                    if (query) {
                        const searchableText = [
                            art.title || '',
                            art.summary || '',
                            art.content || '',
                            art.feedTitle || '',
                            art.author || ''
                        ].join(' ').toLocaleLowerCase('nb-NO');

                        if (!searchableText.includes(query)) return false;
                    }

                    return true;
                }).sort((a, b) => {
                    const dateA = new Date(a.pubDate).getTime() || 0;
                    const dateB = new Date(b.pubDate).getTime() || 0;
                    return dateB - dateA;
                });
            }, [articles, activeFilter.type, activeFilter.id, activeStreamSettings.hideRead, activeStreamSettings.requireImage, folders, blockedWords, searchQuery, recentlyReadIds]);

            const displayedArticles = useMemo(
                () => groupSimilarStories(filteredArticles),
                [filteredArticles]
            );

            const captureScrollAnchor = (root, streamKey) => {
                if (!root || !streamKey) return;

                const rootRect = root.getBoundingClientRect();
                const shells = Array.from(
                    root.querySelectorAll('[data-akkar-article-id]')
                );

                const firstVisible = shells.find(node => {
                    const rect = node.getBoundingClientRect();
                    return rect.bottom > rootRect.top + 4;
                });

                const previous = scrollPositionsRef.current?.[streamKey] || {};
                const nextPosition = {
                    ...previous,
                    scrollTop: root.scrollTop
                };

                if (firstVisible) {
                    const rect = firstVisible.getBoundingClientRect();
                    nextPosition.anchorId = firstVisible.dataset.akkarArticleId || null;
                    nextPosition.anchorOffset = rect.top - rootRect.top;
                }

                scrollPositionsRef.current = {
                    ...(scrollPositionsRef.current || {}),
                    [streamKey]: nextPosition
                };
            };

            const handleMainScroll = (event) => {
                const root = event.currentTarget;
                const currentTop = root.scrollTop;
                const delta = currentTop - lastScrollTopRef.current;
                lastScrollTopRef.current = currentTop;

                if (currentTop <= 60) {
                    upScrollAccumRef.current = 0;
                    if (showFloatingTopBar) setShowFloatingTopBar(false);
                } else if (delta > 6) {
                    upScrollAccumRef.current = 0;
                    if (showFloatingTopBar && !isSizeMenuOpen) {
                        setShowFloatingTopBar(false);
                    }
                } else if (delta < 0) {
                    upScrollAccumRef.current += (-delta);
                    const firstCard = root.querySelector('.akkar-compact-card, .akkar-large-card');
                    const oneCardHeight = firstCard?.offsetHeight || Math.round(110 * (activeStreamSettings.cardScale / 100));
                    if (upScrollAccumRef.current >= oneCardHeight && !showFloatingTopBar) {
                        setShowFloatingTopBar(true);
                    }
                }

                if (!activeStreamKey) return;

                const previous = scrollPositionsRef.current?.[activeStreamKey] || {};

                // Oppdater scrollTop umiddelbart i minnet. Selve localStorage-skrivingen
                // og DOM-søket gjøres sjeldnere, så scrolling fortsatt er lett på mobil.
                scrollPositionsRef.current = {
                    ...(scrollPositionsRef.current || {}),
                    [activeStreamKey]: {
                        ...previous,
                        scrollTop: root.scrollTop
                    }
                };

                if (scrollSaveTimerRef.current) {
                    clearTimeout(scrollSaveTimerRef.current);
                }

                const streamKeyAtScroll = activeStreamKey;
                scrollSaveTimerRef.current = setTimeout(() => {
                    captureScrollAnchor(root, streamKeyAtScroll);
                    persistUiState();
                    scrollSaveTimerRef.current = null;
                }, 180);
            };

            useEffect(() => {
                if (!activeStreamKey || !mainScrollRef.current) return;
                if (restoredStreamKeyRef.current === activeStreamKey) return;

                const savedPosition = scrollPositionsRef.current?.[activeStreamKey];

                // Hvis vi har en lagret posisjon, men artiklene ennå ikke er lastet,
                // vent til listen finnes før vi prøver å finne ankerartikkelen.
                if (savedPosition && displayedArticles.length === 0) return;

                restoredStreamKeyRef.current = activeStreamKey;
                const root = mainScrollRef.current;

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        let targetScrollTop = Math.max(0, savedPosition?.scrollTop || 0);

                        if (savedPosition?.anchorId) {
                            const shells = Array.from(
                                root.querySelectorAll('[data-akkar-article-id]')
                            );
                            const anchor = shells.find(
                                node => node.dataset.akkarArticleId === savedPosition.anchorId
                            );

                            if (anchor) {
                                const rootRect = root.getBoundingClientRect();
                                const anchorRect = anchor.getBoundingClientRect();
                                targetScrollTop =
                                    root.scrollTop +
                                    (anchorRect.top - rootRect.top) -
                                    (savedPosition.anchorOffset || 0);
                            }
                        }

                        root.scrollTop = Math.max(0, targetScrollTop);
                    });
                });
            }, [activeStreamKey, displayedArticles.length]);

            const savedArticles = useMemo(() => {
                return articles
                    .filter(article => article.starred)
                    .sort((a, b) =>
                        (new Date(b.pubDate).getTime() || 0) -
                        (new Date(a.pubDate).getTime() || 0)
                    );
            }, [articles]);

            const visibleSavedArticles = useMemo(() => {
                return savedPanelHideRead
                    ? savedArticles.filter(article => !article.read)
                    : savedArticles;
            }, [savedArticles, savedPanelHideRead]);

            const beginSavedActionPress = (action) => {
                if (savedActionPressTimerRef.current) {
                    clearTimeout(savedActionPressTimerRef.current);
                    savedActionPressTimerRef.current = null;
                }

                savedActionPressStartedRef.current = performance.now();
                setPressedSavedAction(action);
            };

            const endSavedActionPress = (action) => {
                const elapsed = performance.now() - savedActionPressStartedRef.current;
                const remaining = Math.max(0, 140 - elapsed);

                if (savedActionPressTimerRef.current) {
                    clearTimeout(savedActionPressTimerRef.current);
                }

                savedActionPressTimerRef.current = setTimeout(() => {
                    setPressedSavedAction(current => current === action ? null : current);
                    savedActionPressTimerRef.current = null;
                }, remaining);
            };

            const markAllSavedRead = () => {
                const savedUnreadUrls = articlesRef.current
                    .filter(article => article.starred && !article.read && article.url)
                    .map(article => article.url);
                recordReadUrls(savedUnreadUrls, true);

                setArticles(prev => prev.map(article =>
                    article.starred && !article.read
                        ? { ...article, read: true }
                        : article
                ));
            };

            const removeReadFromSaved = () => {
                const hasReadSaved = articlesRef.current.some(article => article.starred && article.read);
                if (!hasReadSaved) {
                    showToast('Ingen leste artikler i Lagret');
                    return;
                }

                setArticles(prev => prev.map(article =>
                    article.starred && article.read
                        ? { ...article, starred: false }
                        : article
                ));
            };

            const clearAllSaved = () => {
                if (!articlesRef.current.some(article => article.starred)) {
                    showToast('Lagret er allerede tom');
                    return;
                }

                setArticles(prev => prev.map(article =>
                    article.starred
                        ? { ...article, starred: false }
                        : article
                ));
            };

            const shareSavedArticles = async () => {
                if (savedArticles.length === 0) {
                    showToast('Ingen lagrede artikler å dele');
                    return;
                }

                const escapeHtml = (value) => String(value ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');

                const makeStandaloneSavedHtml = () => {
                    const cards = savedArticles.map(article => {
                        const title = escapeHtml(article.title || 'Uten tittel');
                        const url = escapeHtml(article.url || '#');
                        const feedTitle = escapeHtml(article.feedTitle || 'RSS');
                        let date = '';

                        try {
                            date = article.pubDate
                                ? new Date(article.pubDate).toLocaleDateString('nb-NO')
                                : '';
                        } catch {}

                        return `
                            <a class="card ${article.read ? 'read' : ''}" href="${url}" target="_blank" rel="noopener noreferrer">
                                <div class="title">${title}</div>
                                <div class="meta">
                                    <span class="source">${feedTitle}</span>
                                    ${date ? `<span>${escapeHtml(date)}</span>` : ''}
                                </div>
                            </a>
                        `;
                    }).join('');

                    return `<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lagrede artikler – Akkar</title>
<style>
:root{color-scheme:dark;--bg:#09142e;--card:#10214d;--border:#233969;--text:#f7f8fb;--muted:#b8c1d9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:22px 14px 40px}
.head{position:sticky;top:0;background:rgba(9,20,46,.96);padding:16px 0 12px;border-bottom:1px solid var(--border);margin-bottom:12px}
h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted)}
.list{display:grid;gap:8px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px}
.card.read{opacity:.62}.title{font-size:14px;font-weight:700;line-height:1.32}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--muted)}
.source{color:#d7b85f}
</style>
</head>
<body>
<main class="wrap">
<header class="head">
<h1>Lagrede artikler</h1>
<div class="sub">Delt fra Akkar · ${savedArticles.length} ${savedArticles.length === 1 ? 'artikkel' : 'artikler'}</div>
</header>
<section class="list">${cards}</section>
</main>
</body>
</html>`;
                };

                const makePlainShareText = () => {
                    const lines = savedArticles.map((article, index) => {
                        const title = article.title || 'Uten tittel';
                        const source = article.feedTitle ? ` (${article.feedTitle})` : '';
                        return `${index + 1}. ${title}${source}\n${article.url || ''}`;
                    });

                    return `Lagrede artikler i Akkar\n\n${lines.join('\n\n')}`;
                };

                try {
                    const isWebHosted =
                        window.location.protocol === 'http:' ||
                        window.location.protocol === 'https:';

                    if (!isWebHosted) {
                        const html = makeStandaloneSavedHtml();
                        const file = new File(
                            [html],
                            'akkar-lagrede-artikler.html',
                            { type: 'text/html;charset=utf-8' }
                        );

                        // Nettlesere blokkerer ofte deling av HTML-filer av sikkerhetsgrunner.
                        // Forsøk bare hvis nettleseren uttrykkelig sier at filtypen kan deles.

                            try {
                                await navigator.share({
                                    title: 'Lagrede artikler i Akkar',
                                    text: 'Her er mine lagrede artikler i Akkar.',
                                    files: [file]
                                });
                                return;
                            } catch (fileShareError) {
                                if (fileShareError?.name === 'AbortError') return;
                                console.warn('HTML-fildeling støttes ikke i denne nettleseren:', fileShareError);
                            }
                        }

                        // Sikker fallback på lokal/content://-visning:
                        // del titler + originale artikkellenker i systemets delingsmeny.
                        const shareText = makePlainShareText();

                        if (typeof navigator.share === 'function') {
                            try {
                                await navigator.share({
                                    title: 'Lagrede artikler i Akkar',
                                    text: shareText
                                });
                                return;
                            } catch (textShareError) {
                                if (textShareError?.name === 'AbortError') return;
                                console.warn('Tekstdeling mislyktes:', textShareError);
                            }
                        }

                        if (navigator.clipboard?.writeText) {
                            await navigator.clipboard.writeText(shareText);
                            showToast('Lenkelisten er kopiert');
                            return;
                        }

                        // Siste fallback: opprett den komplette Lagret-visningen som fil.
                        const blobUrl = URL.createObjectURL(file);
                        const link = document.createElement('a');
                        link.href = blobUrl;
                        link.download = 'akkar-lagrede-artikler.html';
                        document.body.appendChild(link);
                        link.click();
                        link.remove();
                        setTimeout(() => URL.revokeObjectURL(blobUrl), 1500);
                        showToast('Lagret-visningen er lastet ned som HTML');
                        return;
                    }

                    // På et ekte nettsted deles samme HTML-fil som en skjult Lagret-visning.

                        title: article.title || 'Uten tittel',
                        url: article.url || '',
                        feedTitle: article.feedTitle || '',
                        pubDate: article.pubDate || '',
                        read: !!article.read
                    }));

                    const jsonBytes = new TextEncoder().encode(JSON.stringify(payload));
                    let payloadBytes = jsonBytes;
                    let mode = 'u';

                    if ('CompressionStream' in window) {
                        const stream = new Blob([jsonBytes])
                            .stream()
                            .pipeThrough(new CompressionStream('gzip'));
                        payloadBytes = new Uint8Array(await new Response(stream).arrayBuffer());
                        mode = 'g';
                    }

                    let binary = '';
                    for (let i = 0; i < payloadBytes.length; i += 1) {
                        binary += String.fromCharCode(payloadBytes[i]);
                    }

                    const encoded = btoa(binary)
                        .replace(/\+/g, '-')
                        .replace(/\//g, '_')
                        .replace(/=+$/g, '');

                        }

            const moveFeedToFolder = (

            ) => {
                if (!feedId || !fromFolderId || !toFolderId) return;

                const regularFolderCount = folders.filter(
                    folder => folder.id !== UNGROUPED_FOLDER_ID
                ).length;

                const normalizeSidebarSlot = (value) => {
                    const numeric = Number(value);
                    if (!Number.isFinite(numeric)) return 0;
                    return Math.max(0, Math.min(Math.round(numeric), regularFolderCount));

                setFolders(prev => {
                    const sourceFolder = prev.find(f => f.id === fromFolderId);
                    const movingFeed = sourceFolder?.feeds?.find(f => f.id === feedId);
                    if (!movingFeed) return prev;

                    // Flytting mellom to "uten mappe"-plasser.
                    if (
                        fromFolderId === UNGROUPED_FOLDER_ID &&
                        toFolderId === UNGROUPED_FOLDER_ID

                        return prev.map(folder => {
                            if (folder.id !== UNGROUPED_FOLDER_ID) return folder;

                            const remaining = (folder.feeds || []).filter(feed => feed.id !== feedId);
                            const otherSlots = remaining.filter(
                                feed => normalizeSidebarSlot(feed.sidebarSlot) !== targetSlot
                            );
                            const targetFeeds = remaining.filter(
                                feed => normalizeSidebarSlot(feed.sidebarSlot) === targetSlot
                            );

                            const insertAt = Number.isInteger(toIndex)
                                ? Math.max(0, Math.min(toIndex, targetFeeds.length))
                                : targetFeeds.length;

                            targetFeeds.splice(insertAt, 0, {
                                ...movingFeed,
                                sidebarSlot: targetSlot
                            });

                            return {
                                ...folder,
                                feeds: [...otherSlots, ...targetFeeds]
                            };
                        });
                    }

                    // Vanlig omorganisering inne i samme faktiske mappe.
                    if (fromFolderId === toFolderId) {
                        return prev.map(folder => {
                            if (folder.id !== fromFolderId) return folder;

                            const feeds = [...(folder.feeds || [])];
                            const oldIndex = feeds.findIndex(feed => feed.id === feedId);
                            if (oldIndex < 0) return folder;

                            const [moved] = feeds.splice(oldIndex, 1);
                            const insertAt = Number.isInteger(toIndex)
                                ? Math.max(0, Math.min(toIndex, feeds.length))
                                : feeds.length;
                            feeds.splice(insertAt, 0, moved);
                            return { ...folder, feeds };
                        });
                    }

                    const targetExists = prev.some(folder => folder.id === toFolderId);

                    // Første strøm som legges utenfor mapper.
                    if (!targetExists && toFolderId === UNGROUPED_FOLDER_ID) {
                        const remaining = prev.map(folder =>
                            folder.id === fromFolderId
                                ? {
                                    ...folder,
                                    feeds: (folder.feeds || []).filter(feed => feed.id !== feedId)
                                }
                                : folder
                        );

                        return [
                            {
                                id: UNGROUPED_FOLDER_ID,
                                name: 'Uten mappe',
                                feeds: [{
                                    ...movingFeed,
                                    sidebarSlot: targetSlot
                                }]
                            },
                            ...remaining
                        ];

                            const escaped = cleanWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                            const exactWordPattern = new RegExp(
                                `(^|[^\\p{L}\\p{N}_])${escaped}(?=$|[^\\p{L}\\p{N}_])`,
                                'iu'
                            );
                            return exactWordPattern.test(searchableText);
                        });
                        if (matchesBlockedWord) return false;
                    }

                    if (query) {
                        const searchableText = [
                            art.title || '',
                            art.summary || '',
                            art.content || '',
                            art.feedTitle || '',
                            art.author || ''
                        ].join(' ').toLocaleLowerCase('nb-NO');
                        if (!searchableText.includes(query)) return false;
                    }

                    return true;
                };

                const streamHasVisibleUnread = (filterType, filterId, feedIds = null) => {
                    const settings = getEffectiveStreamSettings(filterType, filterId);
                    if (filterType === 'feed') {
                        return articles.some(art => art.feedId === filterId && articleVisibleInStream(art, settings));
                    }
                    const idSet = new Set(feedIds || []);
                    return articles.some(art => idSet.has(art.feedId) && articleVisibleInStream(art, settings));
                };

                const regularFolders = folders.filter(folder => folder.id !== UNGROUPED_FOLDER_ID);
                const ungroupedFolder = folders.find(folder => folder.id === UNGROUPED_FOLDER_ID);
                const normalizeSlot = (val) => {
                    const n = Number(val);
                    return Number.isFinite(n)
                        ? Math.max(0, Math.min(Math.round(n), regularFolders.length))
                        : 0;
                };

                // Bygg nøyaktig samme rekkefølge som i sidemenyen:
                // løse feeder i hvert mellomrom + hver feedsamling (mappe) som én enhet.
                const sidebarUnits = [];
                for (let slot = 0; slot <= regularFolders.length; slot++) {
                    const slotFeeds = (ungroupedFolder?.feeds || []).filter(
                        f => normalizeSlot(f.sidebarSlot) === slot
                    );
                    for (const f of slotFeeds) {
                        sidebarUnits.push({ type: 'feed', id: f.id, name: f.title });
                    }
                    if (slot < regularFolders.length) {
                        const fld = regularFolders[slot];
                        sidebarUnits.push({
                            type: 'folder',
                            id: fld.id,
                            name: fld.name,
                            feedIds: (fld.feeds || []).map(f => f.id)
                        });
                    }
                }

                if (sidebarUnits.length === 0) {
                    showToast('Ingen strømmer');
                    return;
                }

                let currentUnitIdx = -1;
                if (activeFilter.type === 'feed') {
                    const parentFolder = regularFolders.find(folder =>
                        (folder.feeds || []).some(feed => feed.id === activeFilter.id)
                    );
                    if (parentFolder) {
                        currentUnitIdx = sidebarUnits.findIndex(
                            u => u.type === 'folder' && u.id === parentFolder.id
                        );
                    } else {
                        currentUnitIdx = sidebarUnits.findIndex(
                            u => u.type === 'feed' && u.id === activeFilter.id
                        );
                    }
                } else if (activeFilter.type === 'folder') {
                    currentUnitIdx = sidebarUnits.findIndex(
                        u => u.type === 'folder' && u.id === activeFilter.id
                    );
                }

                let nextUnreadUnit = null;
                for (let offset = 1; offset <= sidebarUnits.length; offset++) {
                    const candidate = sidebarUnits[(currentUnitIdx + offset + sidebarUnits.length) % sidebarUnits.length];
                    if (!candidate) continue;
                    const isSameUnit =
                        (candidate.type === activeFilter.type && candidate.id === activeFilter.id) ||
                        (currentUnitIdx >= 0 && sidebarUnits[currentUnitIdx]?.type === candidate.type && sidebarUnits[currentUnitIdx]?.id === candidate.id);
                    if (!isSameUnit && streamHasVisibleUnread(candidate.type, candidate.id, candidate.feedIds)) {
                        nextUnreadUnit = { type: candidate.type, id: candidate.id, name: candidate.name };
                        break;
                    }
                }

                if (nextUnreadUnit) {
                    const nextStreamKey = `${nextUnreadUnit.type}:${nextUnreadUnit.id}`;
                    scrollPositionsRef.current = {
                        ...(scrollPositionsRef.current || {}),
                        [nextStreamKey]: { scrollTop: 0 }
                    };
                    setShowFloatingTopBar(false);
                    upScrollAccumRef.current = 0;
                    lastScrollTopRef.current = 0;
                    setActiveFilter(nextUnreadUnit);
                    if (mainScrollRef.current) {
                        mainScrollRef.current.scrollTop = 0;
                    }
                    requestAnimationFrame(() => {
                        if (mainScrollRef.current) {

                        }

            // ---- Akkar NB-TTS VoxCPM2 opplesing ----

                    setTtsFeedsStatus(`Lagret ${data.feeds?.length || 0} feeder til Mac! Nye artikler forberedes nå i bakgrunnen.`);
                } catch (err) {

            const mobileBackStateRef = useRef({});
            mobileBackStateRef.current = {

            useEffect(() => {
                if (window.location.hash.startsWith('#saved=')) return;

                if (!window.history.state?.akkarMobileGuard) {

                const ensureUserActivatedGuard = () => {
                    if (window.location.hash.startsWith('#saved=')) return;
                    if (window.innerWidth >= 1024) return;
                    if (!window.history.state?.akkarUserGuard) {
                        window.history.pushState({ akkarMobileGuard: true, akkarUserGuard: true }, '');

                };

                    const st = mobileBackStateRef.current;
                    if (st.ttsSettingsOpen) {

            const pinchZoomRef = useRef(null);
            const activeTextScaleRef = useRef(activeStreamSettings.textScale);
            activeTextScaleRef.current = activeStreamSettings.textScale;
            const updateStreamSettingsRef = useRef(updateActiveStreamSettings);
            updateStreamSettingsRef.current = updateActiveStreamSettings;

            useEffect(() => {
                const el = mainScrollRef.current;
                if (!el) return;

                const getDist = (touches) => {
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    return Math.hypot(dx, dy);
                };

                const onTouchStart = (e) => {
                    if (e.touches.length === 2) {
                        pinchZoomRef.current = {
                            startDist: getDist(e.touches),
                            startScale: activeTextScaleRef.current || 100,
                            lastApplied: activeTextScaleRef.current || 100,
                        };
                    }
                };

                const onTouchMove = (e) => {
                    if (e.touches.length !== 2) return;
                    if (!pinchZoomRef.current) {
                        pinchZoomRef.current = {
                            startDist: getDist(e.touches),
                            startScale: activeTextScaleRef.current || 100,
                            lastApplied: activeTextScaleRef.current || 100,
                        };
                    }
                    e.preventDefault();
                    const dist = getDist(e.touches);
                    const { startDist, startScale, lastApplied } = pinchZoomRef.current;
                    if (!startDist) return;
                    const raw = startScale * (dist / startDist);
                    const clamped = Math.max(75, Math.min(150, Math.round(raw / 5) * 5));
                    if (clamped !== lastApplied) {
                        pinchZoomRef.current.lastApplied = clamped;
                        updateStreamSettingsRef.current({ textScale: clamped });
                        showToast(`Tekststørrelse: ${clamped} %`);
                    }
                };

                const onTouchEnd = (e) => {
                    if (e.touches.length < 2) {
                        pinchZoomRef.current = null;
                    }
                };

                el.addEventListener('touchstart', onTouchStart, { passive: true });
                el.addEventListener('touchmove', onTouchMove, { passive: false });
                el.addEventListener('touchend', onTouchEnd, { passive: true });
                el.addEventListener('touchcancel', onTouchEnd, { passive: true });

                return () => {
                    el.removeEventListener('touchstart', onTouchStart);
                    el.removeEventListener('touchmove', onTouchMove);
                    el.removeEventListener('touchend', onTouchEnd);

            const updateTtsSettings = (patch) => {

            const getTtsHeaders = (cfg) => {

            const clearTtsPrefetch = () => {

            const stopTts = async (hideBar = true) => {

                clearTtsPrefetch();

                    setTtsState({
                        visible: false,
