        }


        function AddFeedModal({ folders, setFolders, onClose, showToast }) {
            const [url, setUrl] = useState('');
            const [selectedFolder, setSelectedFolder] = useState('__NONE__');
            const [newFolderName, setNewFolderName] = useState('');
            const [blueskyProfile, setBlueskyProfile] = useState('');
            const [blueskyName, setBlueskyName] = useState('');
            const [mastodonProfile, setMastodonProfile] = useState('');
            const [redditSource, setRedditSource] = useState('');
            const [youtubeSource, setYoutubeSource] = useState('');
            const [substackSource, setSubstackSource] = useState('');
            const [googleNewsQuery, setGoogleNewsQuery] = useState('');
            const [sourceName, setSourceName] = useState('');
            const [isResolvingSource, setIsResolvingSource] = useState(false);
            const [feedSearchResults, setFeedSearchResults] = useState([]);
            const [feedSearchMessage, setFeedSearchMessage] = useState('');
            const [showAllFeedResults, setShowAllFeedResults] = useState(false);
            const [feedSearchHistory, setFeedSearchHistory] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('akkar_feed_search_history') || '[]');
                } catch {
                    return [];
                }
            });
            const [activeTab, setActiveTab] = useState('add');

            const looksLikeBareSiteName = (value) => {
                const raw = (value || '').trim();
                if (!raw) return false;

                // Bare navn/ord, f.eks. "tek", "nrk", "aftenposten".
                // Ikke URL, ikke domene, ikke sti.
                return /^[a-z0-9æøå_-]+$/i.test(raw) && !raw.includes('.');
            };

            const candidateUrlsForName = (value) => {
                const raw = (value || '')
                    .trim()
                    .toLowerCase()
                    .replace(/\s+/g, '')
                    .replace(/[^a-z0-9æøå-]/gi, '');

                if (!raw) return [];

                // Prioriter norske og vanlige kommersielle domener,
                // og prøv de to vanligste feed-banene direkte.
                return [
                    `https://${raw}.no`,
                    `https://${raw}.com`,
                    `https://${raw}.no/rss`,
                    `https://${raw}.no/feed`,
                    `https://${raw}.com/rss`,
                    `https://${raw}.com/feed`
                ];
            };

            const searchFeedsearchDev = async (value) => {
                const normalized = normalizeWebsiteUrl(value);
                if (!normalized) return [];

                let domainOrUrl = normalized;
                try {
                    const parsed = new URL(normalized);
                    // For et vanlig domene gir Feedsearch alle tidligere funne feeds
                    // knyttet til domenet, som er raskere enn å crawle én bestemt side.
                    domainOrUrl = parsed.pathname === '/' && !parsed.search && !parsed.hash
                        ? parsed.hostname
                        : normalized;
                } catch {}

                const apiUrl =
                    `https://feedsearch.dev/api/v1/search?url=${encodeURIComponent(domainOrUrl)}` +
                    `&info=true&favicon=false&opml=false&skip_crawl=false`;

                try {
                    const response = await fetch(apiUrl, {
                        cache: 'no-store',
                        headers: { 'Accept': 'application/json' }
                    });

                    if (!response.ok) return [];

                    const data = await response.json();
                    if (!Array.isArray(data)) return [];

                    const seen = new Set();

                    return data
                        .filter(item => item && item.url && !item.bozo)
                        .map(item => {
                            const feedUrl = item.url;
                            const key = feedUrl.toLowerCase();
                            if (seen.has(key)) return null;
                            seen.add(key);

                            const version = (item.version || '').toLowerCase();
                            const contentType = (item.content_type || '').toLowerCase();

                            let type = 'application/rss+xml';
                            if (version.includes('atom') || contentType.includes('atom')) {
                                type = 'application/atom+xml';
                            } else if (version.includes('json') || contentType.includes('json')) {
                                type = 'application/feed+json';
                            }

                            return {
                                feedUrl,
                                title: item.title || item.site_name || '',
                                type,
                                discoveredFrom: item.site_url || normalized,
                                favicon: item.favicon || '',
                                description: item.description || '',
                                itemCount: item.item_count ?? null,
                                lastUpdated: item.last_updated || '',
                                provider: 'feedsearch'
                            };
                        })
                        .filter(Boolean);
                } catch (error) {
                    console.warn('Feedsearch.dev feilet:', error);
                    return [];
                }
            };

            const checkDirectFeedUrl = async (candidateUrl) => {
                try {
                    const text = await fetchPageText(candidateUrl);
                    if (!text) return null;

                    const sample = text.slice(0, 2000).toLowerCase();

                    if (
                        sample.includes('<rss') ||
                        sample.includes('<feed') ||
                        sample.includes('<rdf:rdf')
                    ) {
                        return {
                            feedUrl: candidateUrl,
                            title: '',
                            type: sample.includes('<feed')
                                ? 'application/atom+xml'
                                : 'application/rss+xml',
                            discoveredFrom: (() => {
                                try { return new URL(candidateUrl).origin; }
                                catch { return candidateUrl; }
                            })(),
                            provider: 'direct'
                        };
                    }
                } catch {}

                return null;
            };

            const rankFeedResults = (items, searchValue) => {
                const raw = (searchValue || '').trim().toLowerCase();

                const scored = items.map(item => {
                    let score = 0;
                    const url = (item.feedUrl || '').toLowerCase();
                    const title = (item.title || '').toLowerCase();

                    if (item.provider === 'feedsearch') score += 20;
                    if (item.itemCount > 0) score += Math.min(15, Math.log10(item.itemCount + 1) * 5);

                    // Hovedfeeder får høy prioritet.
                    if (/\/(rss|feed|rss\.xml|feed\.xml|feeds\/general\.xml)\/?$/i.test(url)) score += 35;
                    if (/top|main|general|latest|news|nyheter|siste|toppsaker/i.test(title + ' ' + url)) score += 12;

                    // Tekniske/smale feeder nedprioriteres.
                    if (/comments|comment|author|tag|category|search|podcast|video|forum/i.test(title + ' ' + url)) score -= 25;

                    if (raw && (title.includes(raw) || url.includes(raw))) score += 10;

                    return { ...item, _score: score };
                });

                scored.sort((a, b) => b._score - a._score);

                return scored.map((item, index) => ({
                    ...item,
                    recommended: index === 0
                }));
            };

            const rememberFeedSearch = (value) => {
                const clean = (value || '').trim();
                if (!clean) return;

                setFeedSearchHistory(prev => {
                    const next = [clean, ...prev.filter(item => item.toLowerCase() !== clean.toLowerCase())].slice(0, 5);
                    try {
                        localStorage.setItem('akkar_feed_search_history', JSON.stringify(next));
                    } catch {}
                    return next;
                });
            };

            const handleFeedSearch = async () => {
                const raw = url.trim();

                if (!raw) {
                    showToast('Skriv inn navn på et nettsted eller en nettadresse');
                    return;
                }

                setIsResolvingSource(true);
                setFeedSearchResults([]);
                setFeedSearchMessage('');
                setShowAllFeedResults(false);
                rememberFeedSearch(raw);

                try {
                    let results = [];

                    if (looksLikeBareSiteName(raw)) {
                        // Navnesøk, f.eks. "tek":
                        // prøv .no/.com og /rss-/feed-banene parallelt.
                        const candidates = candidateUrlsForName(raw);

                        const domainCandidates = candidates.slice(0, 2);
                        const directFeedCandidates = candidates.slice(2);

                        const [feedsearchGroups, directFeedChecks] = await Promise.all([
                            Promise.all(
                                domainCandidates.map(candidate =>
                                    searchFeedsearchDev(candidate)
                                )
                            ),
                            Promise.all(
                                directFeedCandidates.map(candidate =>
                                    checkDirectFeedUrl(candidate)
                                )
                            )
                        ]);

                        results.push(...feedsearchGroups.flat());
                        results.push(...directFeedChecks.filter(Boolean));

                        // Hvis ingen av de raske metodene fant noe,
                        // gjør full lokal oppdagelse på .no og .com parallelt.
                        if (results.length === 0) {
                            const localGroups = await Promise.all(
                                domainCandidates.map(candidate =>
                                    discoverFeedsFromWebsite(candidate)
                                )
                            );
                            results.push(...localGroups.flat());
                        }
                    } else {
                        const normalized = normalizeWebsiteUrl(raw);

                        if (!normalized) {
                            showToast('Skriv f.eks. tek, tek.no eller https://tek.no');
                            return;
                        }

                        // URL/domene: Feedsearch først.
                        results = await searchFeedsearchDev(normalized);

                        // Lokal discovery som fallback.
                        if (results.length === 0) {
                            results = await discoverFeedsFromWebsite(normalized);
                        }
                    }

                    // Fjern dubletter.
                    const unique = [];
                    const seen = new Set();

                    for (const item of results) {
                        const key = (item.feedUrl || '').toLowerCase();
                        if (!key || seen.has(key)) continue;
                        seen.add(key);
                        unique.push(item);
                    }

                    const ranked = rankFeedResults(unique, raw);
                    setFeedSearchResults(ranked);

                    if (ranked.length === 0) {
                        setFeedSearchMessage(
                            looksLikeBareSiteName(raw)
                                ? `Fant ingen strømmer for «${raw}». Prøv nettadressen direkte.`
                                : 'Fant ingen tilgjengelige strømmer.'
                        );
                    } else {
                        setFeedSearchMessage(
                            `${ranked.length} strøm${ranked.length === 1 ? '' : 'mer'} funnet`
                        );
                    }
                } catch (error) {
                    console.error('Søk etter strømmer feilet:', error);
                    setFeedSearchMessage('Kunne ikke finne strømmer akkurat nå.');
                } finally {
                    setIsResolvingSource(false);
                }
            };

            const toggleDiscoveredFeed = (result) => {
                const normalizedUrl = (result.feedUrl || '').trim().toLowerCase();

                const existingLocation = folders
                    .map(folder => ({
                        folder,
                        feed: (folder.feeds || []).find(
                            feed => (feed.url || '').trim().toLowerCase() === normalizedUrl
                        )
                    }))
                    .find(item => item.feed);

                // Allerede lagt til: trykk igjen for å fjerne.
                if (existingLocation) {
                    const removedFeedId = existingLocation.feed.id;

                    setFolders(prev => prev.map(folder =>
                        folder.id === existingLocation.folder.id
                            ? {
                                ...folder,
                                feeds: (folder.feeds || []).filter(feed => feed.id !== removedFeedId)
                            }
                            : folder
                    ));

                    return;
                }

                // Ikke lagt til: legg til i valgt mappe.
                let fallbackTitle = result.title || '';

                if (!fallbackTitle) {
                    try {
                        fallbackTitle = new URL(result.feedUrl).hostname.replace(/^www\./, '');
                    } catch {
                        fallbackTitle = 'nyhetsstrøm';
                    }
                }

                const newFeed = {
                    id: `discovered-feed-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
                    title: fallbackTitle,
                    url: result.feedUrl,
                    type: 'rss',
                    sourceUrl: result.discoveredFrom || '',
                    icon: 'rss'
                };

                let targetFolderName = 'uten mappe';

                if (selectedFolder === '__NONE__') {
                    setFolders(prev => {
                        const ungrouped = prev.find(folder => folder.id === UNGROUPED_FOLDER_ID);

                        if (ungrouped) {
                            return prev.map(folder =>
                                folder.id === UNGROUPED_FOLDER_ID
                                    ? { ...folder, feeds: [...(folder.feeds || []), newFeed] }
                                    : folder
                            );
                        }

                        return [...prev, {
                            id: UNGROUPED_FOLDER_ID,
                            name: 'Uten mappe',
                            feeds: [newFeed]
                        }];
                    });
                } else if (selectedFolder === '__NEW__') {
                    const folderName = newFolderName.trim() || 'Ny mappe';
                    targetFolderName = folderName;

                    const newFolderObj = {
                        id: `f-${Date.now()}`,
                        name: folderName,
                        feeds: [newFeed]
                    };

                    setFolders(prev => [...prev, newFolderObj]);
                    setSelectedFolder(newFolderObj.id);
                    setNewFolderName('');
                } else {
                    const target = folders.find(f => f.id === selectedFolder);
                    targetFolderName = target?.name || 'mappe';

                    setFolders(prev => prev.map(f =>
                        f.id === selectedFolder
                            ? { ...f, feeds: [...f.feeds, newFeed] }
                            : f
                    ));
                }

            };

            const handleAddFeed = async (e) => {
                e.preventDefault();
                if (!url.trim()) return;

                const normalizedWebsiteUrl = normalizeWebsiteUrl(url);
                const inputValue = normalizedWebsiteUrl || url.trim();

                let resolvedUrl = inputValue;
                let feedType = 'rss';
                let sourceUrl = '';
                let feedTitle = inputValue.replace('https://', '').replace('http://', '').split('/')[0];

                const blueskyRss = blueskyProfileToRss(inputValue);
                const mastodonRss = mastodonProfileToRss(inputValue);
                const redditRss = redditToRss(inputValue);

                let substackRss = null;
                try {
                    const parsed = new URL(url);
                    if (parsed.hostname.toLowerCase().includes('substack.com')) {
                        substackRss = substackToRss(inputValue);
                    }
                } catch {}

                if (blueskyRss) {
                    const profile = normalizeBlueskyProfile(url);
                    resolvedUrl = blueskyRss;
                    feedType = 'bluesky';
                    sourceUrl = profile || '';
                    feedTitle = profile?.split('/').pop() || 'Bluesky';
                } else if (mastodonRss) {
                    const profile = normalizeMastodonProfile(url);
                    resolvedUrl = mastodonRss;
                    feedType = 'mastodon';
                    sourceUrl = profile || '';
                    feedTitle = profile?.split('/').pop()?.replace('@', '') || 'Mastodon';
                } else if (redditRss && /reddit\.com|^r\/|^[A-Za-z0-9_]+$/i.test(url.trim())) {
                    resolvedUrl = redditRss;
                    feedType = 'reddit';
                    sourceUrl = redditRss.replace('/.rss', '');
                    feedTitle = sourceUrl.split('/').pop() || 'Reddit';
                } else if (substackRss) {
                    resolvedUrl = substackRss;
                    feedType = 'substack';
                    sourceUrl = new URL(url).origin;
                    feedTitle = new URL(url).hostname.split('.')[0] || 'Substack';
                } else if (isYouTubeInput(inputValue)) {
                    setIsResolvingSource(true);
                    const yt = await resolveYouTubeFeed(inputValue);
                    setIsResolvingSource(false);

                    if (!yt) {
                        showToast('Fant ikke YouTube-kanalen');
                        return;
                    }

                    resolvedUrl = yt.feedUrl;
                    feedType = 'youtube';
                    sourceUrl = yt.sourceUrl;
                    feedTitle = yt.title || 'YouTube';
                } else {
                    if (!normalizedWebsiteUrl) {
                        showToast('Skriv inn en nettadresse, f.eks. nrk.no');
                        return;
                    }

                    // Vanlig nettside: prøv å finne RSS/Atom automatisk.
                    setIsResolvingSource(true);
                    const discovered = await discoverFeedFromWebsite(inputValue);
                    setIsResolvingSource(false);

                    if (discovered?.feedUrl && discovered.feedUrl !== url.trim()) {
                        resolvedUrl = discovered.feedUrl;
                        sourceUrl = discovered.discoveredFrom || inputValue;
                        feedType = 'rss';

                        try {
                            const parsedSource = new URL(sourceUrl);
                            feedTitle = parsedSource.hostname.replace(/^www\./, '');
                        } catch {}

                    } else if (!discovered?.feedUrl) {
                        // Ingen feed ble funnet. Behold den oppgitte adressen slik at
                        // eksisterende støtte for direkte RSS/Atom fortsatt fungerer.
                        resolvedUrl = inputValue;
                        sourceUrl = inputValue;
                    }
                }

                const newFeed = {
                    id: `custom-feed-${Date.now()}`,
                    title: feedTitle,
                    url: resolvedUrl,
                    type: feedType,
                    sourceUrl,
                    icon: feedType === 'rss' ? 'rss' : 'link'
                };

                if (selectedFolder === '__NONE__') {
                    setFolders(prev => {
                        const ungrouped = prev.find(folder => folder.id === UNGROUPED_FOLDER_ID);

                        if (ungrouped) {
                            return prev.map(folder =>
                                folder.id === UNGROUPED_FOLDER_ID
                                    ? { ...folder, feeds: [...(folder.feeds || []), newFeed] }
                                    : folder
                            );
                        }

                        return [...prev, {
                            id: UNGROUPED_FOLDER_ID,
                            name: 'Uten mappe',
                            feeds: [newFeed]
                        }];
                    });
                } else if (selectedFolder === '__NEW__') {
                    const folderName = newFolderName.trim() || 'Ny mappe';
                    const newFolderObj = {
                        id: `f-${Date.now()}`,
                        name: folderName,
                        feeds: [newFeed]
                    };
                    setFolders(prev => [...prev, newFolderObj]);
                } else {
                    setFolders(prev => prev.map(f => {
                        if (f.id === selectedFolder) {
                            return { ...f, feeds: [...f.feeds, newFeed] };
                        }
                        return f;
                    }));
                }

                onClose();
            };

            const addServiceFeed = (folderName, feed) => {
                setFolders(prev => {
                    const existingFolder = prev.find(f => f.name.toLowerCase() === folderName.toLowerCase());

                    if (existingFolder) {
                        return prev.map(f =>
                            f.id === existingFolder.id
                                ? { ...f, feeds: [...f.feeds, feed] }
                                : f
                        );
                    }

                    return [...prev, {
                        id: `${folderName.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-folder-${Date.now()}`,
                        name: folderName,
                        feeds: [feed]
                    }];
                });
            };

            const handleAddBluesky = (e) => {
                e.preventDefault();

                const profileUrl = normalizeBlueskyProfile(blueskyProfile);
                const rssUrl = blueskyProfileToRss(blueskyProfile);

                if (!profileUrl || !rssUrl) {
                    showToast('Ugyldig Bluesky-profil');
                    return;
                }

                const handle = profileUrl.split('/').pop();
                const newFeed = {
                    id: `bluesky-feed-${Date.now()}`,
                    title: blueskyName.trim() || handle,
                    url: rssUrl,
                    type: 'bluesky',
                    sourceUrl: profileUrl,
                    icon: 'message-circle'
                };

                setFolders(prev => {
                    const existingFolder = prev.find(f => f.name.toLowerCase() === 'bluesky');

                    if (existingFolder) {

                            name: rec.category || 'Mine Feeder',
                            feeds: [newFeed]
                        }];
                    }
                    const targetFolder = prev.find(f => f.name.toLowerCase().includes(rec.category.toLowerCase())) || prev[0];
                    return prev.map(f => {
                        if (f.id === targetFolder.id) {
                            return { ...f, feeds: [...f.feeds, newFeed] };
                        }
                        return f;
                    });
                });

            };

            const importOPML = async (file) => {
                if (!file) return;

                try {
                    const text = await file.text();
                    const xml = new DOMParser().parseFromString(text, 'text/xml');

                    if (xml.querySelector('parsererror')) {
                        showToast('Ugyldig OPML-fil');
                        return;
                    }

                    const body = xml.querySelector('opml > body') || xml.querySelector('body');
                    if (!body) {
                        showToast('Ingen feeder funnet');
                        return;
                    }

                    const existingUrls = new Set(
                        folders.flatMap(folder => folder.feeds || [])
                            .map(feed => (feed.url || '').trim().toLowerCase())
                    );

                    let importedCount = 0;
                    const importedFolders = [];
                    const looseFeeds = [];

                    const makeFeed = (outline) => {
                        const url =
                            outline.getAttribute('xmlUrl') ||
                            outline.getAttribute('xmlurl') ||
                            outline.getAttribute('url');

                        if (!url) return null;

                        const normalizedUrl = url.trim().toLowerCase();
                        if (!normalizedUrl || existingUrls.has(normalizedUrl)) return null;

                        existingUrls.add(normalizedUrl);
                        importedCount += 1;

                        const importedType = outline.getAttribute('akkarType') || 'rss';

                        return {
                            id: `opml-feed-${Date.now()}-${importedCount}-${Math.random().toString(36).slice(2, 7)}`,
                            title:
                                outline.getAttribute('text') ||
                                outline.getAttribute('title') ||
                                url,
                            url: url.trim(),
                            type: importedType,
                            sourceUrl: outline.getAttribute('sourceUrl') || '',
                            icon: importedType === 'bluesky' ? 'message-circle' : 'rss'
                        };
                    };

                    // Toppnivå-outline med under-outline behandles som mapper.
                    Array.from(body.children).forEach((outline, folderIndex) => {
                        if (outline.tagName?.toLowerCase() !== 'outline') return;

                        const childOutlines = Array.from(outline.children).filter(
                            child => child.tagName?.toLowerCase() === 'outline'
                        );

                        if (childOutlines.length > 0) {
                            const feeds = [];

                            childOutlines.forEach(child => {
                                const feed = makeFeed(child);
                                if (feed) feeds.push(feed);
                            });

                            if (feeds.length > 0) {
                                importedFolders.push({
                                    id: `opml-folder-${Date.now()}-${folderIndex}-${Math.random().toString(36).slice(2, 7)}`,
                                    name:
                                        outline.getAttribute('text') ||
                                        outline.getAttribute('title') ||
                                        'Importert',
                                    feeds
                                });
                            }
                        } else {
                            const feed = makeFeed(outline);
                            if (feed) looseFeeds.push(feed);
                        }
                    });

                    if (importedCount === 0) {
                        showToast('Ingen nye feeder');
                        return;
                    }

                    setFolders(prev => {
                        let next = [...prev, ...importedFolders];

                        if (looseFeeds.length > 0) {
                            const ungroupedIndex = next.findIndex(folder => folder.id === UNGROUPED_FOLDER_ID);

                            if (ungroupedIndex >= 0) {
                                next = next.map((folder, index) =>
                                    index === ungroupedIndex
                                        ? { ...folder, feeds: [...(folder.feeds || []), ...looseFeeds] }
                                        : folder
                                );
                            } else {
                                next.push({
                                    id: UNGROUPED_FOLDER_ID,
                                    name: 'Uten mappe',
                                    feeds: looseFeeds
                                });
                            }
                        }

                        return next;
                    });
                    showToast(`${importedCount} importert`);
                } catch (error) {
                    console.error('OPML-import feilet:', error);
                    showToast('Kunne ikke importere');

<opml version="2.0">
  <head><title>Akkar-abonnementer</title></head>
  <body>
    ${folders.map(f => {
      if (f.id === UNGROUPED_FOLDER_ID) {

    </outline>`;
    }).join('')}
  </body>
</opml>`;

                const blob = new Blob([xmlContent], { type: 'text/xml' });

                        </div>
                    </div>
                </div>
            );
        }

        class AkkarErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, message: '' };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, message: error?.message || 'Ukjent feil' };
            }

            componentDidCatch(error, info) {
                console.error('Akkar render-feil:', error, info);
            }

            render() {
                if (this.state.hasError) {
                    window.__hideAkkarBoot?.();
                    return (
                        <div className="h-screen w-screen bg-darkbg text-brand-100 flex items-center justify-center p-6">
                            <div className="max-w-sm text-center">
                                <AkkarLogo />
                                <h1 className="font-bold text-lg mt-4 text-accent-300">Akkar fikk en feil</h1>
                                <p className="text-sm mt-2 text-brand-200">{this.state.message}</p>
                                <button
                                    onClick={() => location.reload()}
                                    className="mt-4 px-4 py-2 rounded-lg bg-brand-600 text-white"
                                >
                                    Last inn på nytt
                                </button>
                            </div>
                        </div>
                    );
                }

                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AkkarErrorBoundary>
                <AkkarApp />
            </AkkarErrorBoundary>
        );

        requestAnimationFrame(() => {
            window.__hideAkkarBoot?.();
        });

        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
